<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo, createContext, useContext } = React;

/* ════════════════════════════════════════════════════════════════
   IN-APP DIALOG SYSTEM
   Replaces window.prompt / window.alert / window.confirm which
   are blocked or ugly inside iOS standalone PWAs.
════════════════════════════════════════════════════════════════ */
const DialogContext = createContext(null);
function useDialog() { return useContext(DialogContext); }

function DialogHost({ state, onResolve }) {
  const [text, setText] = useState('');
  const inputRef = useRef(null);
  useEffect(() => {
    setText(state?.defaultValue || '');
    if (state?.kind === 'prompt') {
      setTimeout(() => inputRef.current?.focus(), 60);
    }
  }, [state]);

  if (!state) return null;
  const { kind, title, message, confirmLabel, cancelLabel, danger, placeholder } = state;

  function handleConfirm() { onResolve(kind === 'prompt' ? text : true); }
  function handleCancel()  { onResolve(kind === 'alert' ? true : (kind === 'prompt' ? null : false)); }

  return (
    <div className="dlg-backdrop" onClick={e => { if (e.target === e.currentTarget) handleCancel(); }}>
      <div className="dlg-box" role="dialog" aria-modal="true">
        {title && <div className="dlg-title">{title}</div>}
        <div className="dlg-msg">
          {message}
          {kind === 'prompt' && (
            <input
              ref={inputRef}
              type="text"
              value={text}
              placeholder={placeholder || ''}
              onChange={e => setText(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') handleConfirm(); if (e.key === 'Escape') handleCancel(); }}
            />
          )}
        </div>
        <div className="dlg-actions">
          {kind !== 'alert' && (
            <button className="dlg-btn" onClick={handleCancel}>
              {cancelLabel || 'Cancel'}
            </button>
          )}
          <button className={`dlg-btn ${danger ? 'danger' : 'primary'}`} onClick={handleConfirm}>
            {confirmLabel || (kind === 'alert' ? 'OK' : 'Confirm')}
          </button>
        </div>
      </div>
    </div>
  );
}

// Hook API: const dlg = useDialog(); await dlg.prompt(...), dlg.confirm(...), dlg.alert(...)
function useDialogApi() {
  const [state, setState] = useState(null);
  const resolverRef = useRef(null);

  function open(opts) {
    return new Promise(resolve => {
      resolverRef.current = resolve;
      setState(opts);
    });
  }
  function resolve(value) {
    const r = resolverRef.current;
    resolverRef.current = null;
    setState(null);
    if (r) r(value);
  }
  return {
    state,
    resolve,
    prompt:  (title, defaultValue='', opts={}) => open({ kind:'prompt', title, defaultValue, ...opts }),
    confirm: (title, message='', opts={}) => open({ kind:'confirm', title, message, ...opts }),
    alert:   (title, message='', opts={}) => open({ kind:'alert', title, message, ...opts }),
  };
}

/* ─── OFFLINE SYNC QUEUE ────────────────────────────────────── */
function loadSyncQueue() {
  try { return JSON.parse(localStorage.getItem('claylog_syncqueue') || '[]'); }
  catch { return []; }
}
function saveSyncQueue(q) {
  try { localStorage.setItem('claylog_syncqueue', JSON.stringify(q)); } catch {}
  try { window.dispatchEvent(new Event('syncqueuechange')); } catch {}
}
function newOpId() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}
function queueSyncOp(op) {
  const q = loadSyncQueue();
  q.push({ ...op, id: newOpId(), ts: Date.now() });
  saveSyncQueue(q);
}
function isNetworkError(e) {
  return e instanceof TypeError || /network|fetch/i.test(e.message || '');
}
async function flushSyncQueue(token) {
  let q = loadSyncQueue();
  if (!q.length) return { ok: 0, failed: 0, authFailed: false };
  if (q.some(op => !op.id)) {
    q = q.map(op => op.id ? op : { ...op, id: newOpId() });
    saveSyncQueue(q);
  }
  const doneIds = new Set();
  const dropIds = new Set();
  let ok = 0;
  let authFailed = false;
  for (const op of q) {
    if (authFailed) continue;
    let tok = token;
    try { tok = JSON.parse(localStorage.getItem('claylog_auth'))?.token || token; } catch {}
    try {
      await sbFetch(op.method, op.table, op.body, op.filter, tok, true, true);
      ok++;
      doneIds.add(op.id);
    } catch (e) {
      if (e.message === 'AUTH_EXPIRED') {
        authFailed = true;
      } else if (!isNetworkError(e)) {
        dropIds.add(op.id);
      }
    }
  }
  const current = loadSyncQueue().filter(op => !doneIds.has(op.id) && !dropIds.has(op.id));
  saveSyncQueue(current);
  return { ok, failed: current.length, authFailed };
}

async function sbFetch(method, table, body, filter, token, retry = true, noQueue = false) {
  const headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + (token || SUPABASE_KEY),
    'Prefer': method === 'POST' ? 'resolution=merge-duplicates,return=minimal' : 'return=minimal'
  };
  let res;
  try {
    res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${filter || ''}`, {
      method,
      headers,
      body: body ? JSON.stringify(body) : null
    });
  } catch (e) {
    if (!noQueue && (method === 'POST' || method === 'PATCH' || method === 'DELETE')) {
      queueSyncOp({ method, table, body, filter });
    }
    throw e;
  }
  if (res.status === 401) {
    if (retry) {
      try {
        const newToken = await refreshAccessToken();
        return await sbFetch(method, table, body, filter, newToken, false, noQueue);
      } catch (_) {}
    }
    if (!noQueue && (method === 'POST' || method === 'PATCH' || method === 'DELETE')) {
      queueSyncOp({ method, table, body, filter });
    }
    throw new Error('AUTH_EXPIRED');
  }
  if (!res.ok) { const e = await res.text(); throw new Error(`[${res.status}] ${e}`); }
  if (method === 'DELETE' || method === 'PATCH' || method === 'POST') return null;
  return res.json();
}

async function authSignIn(email, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed');
  return data;
}
async function authSignUp(email, password, name) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
    body: JSON.stringify({ email, password, data: { name } })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || 'Sign up failed');
  return data;
}
async function authRefresh(refreshToken) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
    body: JSON.stringify({ refresh_token: refreshToken })
  });
  if (!res.ok) throw new Error('Refresh failed');
  return res.json();
}
let _authRefreshInFlight = null;
let _onAuthStateChange = null;
async function refreshAccessToken() {
  if (_authRefreshInFlight) return _authRefreshInFlight;
  _authRefreshInFlight = (async () => {
    let saved;
    try { saved = JSON.parse(localStorage.getItem('claylog_auth')) || null; } catch { saved = null; }
    if (!saved?.refresh_token) throw new Error('NO_REFRESH_TOKEN');
    const data = await authRefresh(saved.refresh_token);
    const expiresAt = Date.now() + (data.expires_in || 3600) * 1000;
    const merged = {
      token: data.access_token,
      refresh_token: data.refresh_token || saved.refresh_token,
      user: data.user || saved.user,
      expires_at: expiresAt
    };
    try { localStorage.setItem('claylog_auth', JSON.stringify(merged)); } catch {}
    try { _onAuthStateChange && _onAuthStateChange(data, expiresAt); } catch {}
    return data.access_token;
  })();
  try { return await _authRefreshInFlight; }
  finally { _authRefreshInFlight = null; }
}

  await fetch(`${SUPABASE_URL}/auth/v1/recover`, {

  });
}

function AuthScreen({ onLogin }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');
  const [loading, setLoading] = useState(false);

  async function handleLogin() {
    if (!email || !password) { setError('Please enter email and password.'); return; }
    setLoading(true); setError(''); setSuccess('');
    try {
      const data = await authSignIn(email, password);
      onLogin(data);
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  }
  async function handleRegister() {
    if (!email || !password || !name) { setError('Please fill in all fields.'); return; }
    if (password.length < 6) { setError('Password must be at least 6 characters.'); return; }
    setLoading(true); setError(''); setSuccess('');
    try {
      const data = await authSignUp(email, password, name);
      if (data.access_token) { onLogin(data); return; }
      if (data.session?.access_token) { onLogin(data.session); return; }
      try {
        const loginData = await authSignIn(email, password);
        onLogin(loginData);
      } catch {
        setSuccess('✅ Account created! Please confirm your email and sign in.');
        setTimeout(() => { setMode('login'); setSuccess(''); }, 3000);
      }
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  }
  async function handleForgot() {
    if (!email) { setError('Bitte zuerst E-Mail eingeben.'); return; }
    setLoading(true);
    try {
      await authForgotPassword(email);
      setSuccess('✅ Email sent! Check your inbox.');
    } catch { setError('Error sending email.'); }
    finally { setLoading(false); }
  }
  return (
    <div className="auth-screen">
      <div style={{marginBottom:'8px',textAlign:'center'}}>
        <img src="logo.png" style={{width:'72px',height:'72px',objectFit:'contain',display:'block',margin:'0 auto 8px auto'}} alt="ClayLog" />
        <div className="auth-logo">ClayLog</div>
      </div>
      <div className="auth-box">
        <div className="auth-title">{mode === 'login' ? 'Sign in' : 'Sign up'}</div>
        {mode === 'register' && (
          <div className="form-group">
            <label>Name</label>
            <input type="text" placeholder="Your name" value={name} onChange={e=>setName(e.target.value)} />
          </div>
        )}
        <div className="form-group">
          <label>Email</label>
          <input type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} />
        </div>
        <div className="form-group">
          <label>Password</label>
          <input type="password" placeholder="Min. 6 characters" value={password}
            onChange={e=>setPassword(e.target.value)}
            onKeyDown={e => e.key==='Enter' && mode==='login' && handleLogin()} />
        </div>
        {error && <div className="auth-error">{error}</div>}
        {success && <div className="auth-success">{success}</div>}
        {mode === 'login' ? (
          <button className="btn btn-primary" onClick={handleLogin} disabled={loading} style={{marginTop:'4px'}}>
            {loading ? '⟳ Loading…' : 'Sign in'}
          </button>
        ) : (
          <button className="btn btn-primary" onClick={handleRegister} disabled={loading} style={{marginTop:'4px'}}>
            {loading ? '⟳ Loading…' : 'Sign up'}
          </button>
        )}
        <button className="auth-link" onClick={() => { setMode(mode==='login'?'register':'login'); setError(''); setSuccess(''); }}>
          {mode === 'login' ? 'No account yet? Sign up' : 'Already have an account? Sign in'}
        </button>
        {mode === 'login' && (
          <button className="auth-forgot" onClick={handleForgot} disabled={loading}>
            Forgot password?
          </button>
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════

function parseICS(text) {
  if (!text) return [];
  text = text.replace(/\r\n[ \t]/g, '').replace(/\r/g, '');
  const events = [];
  const blocks = text.split('BEGIN:VEVENT');
  blocks.slice(1).forEach(block => {
    const get = (key) => {
      const m = block.match(new RegExp('(?:^|\\n)' + key + '(?:;[^:\\n]*)?:([^\\n]+)', 'i'));
      return m ? m[1].trim() : '';
    };
    const dtRaw = get('DTSTART');
    const dtEnd  = get('DTEND');
    if (!dtRaw) return;
    function parseDate(s) {
      if (!s) return null;
      if (/^\d{8}$/.test(s))
        return new Date(`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T00:00:00`);
      if (s.endsWith('Z')) {
        const c = s.replace(/[TZ]/g,'');
        return new Date(`${c.slice(0,4)}-${c.slice(4,6)}-${c.slice(6,8)}T${c.slice(8,10)}:${c.slice(10,12)}:00Z`);
      }
      const c = s.replace('T','');
      return new Date(`${c.slice(0,4)}-${c.slice(4,6)}-${c.slice(6,8)}T${c.slice(8,10)||'00'}:${c.slice(10,12)||'00'}:00`);
    }
    const start = parseDate(dtRaw);
    if (!start || isNaN(start)) return;
    const end = parseDate(dtEnd);
    const decode = s => s.replace(/\\n/g,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');
    events.push({
      uid:      get('UID') || Math.random().toString(36),
      title:    decode(get('SUMMARY'))     || 'Event',
      location: decode(get('LOCATION'))    || '',
      notes:    decode(get('DESCRIPTION')) || '',
      start, end,
      date:     `${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`,
      allDay:   /^\d{8}$/.test(dtRaw),
    });
  });
  return events.sort((a,b) => a.start - b.start);
}

const ICS_CACHE_KEY = 'claylog_ics_cache';
const ICS_CACHE_TTL = 30 * 60 * 1000;

function useICSFeed(url) {
  const [events, setEvents] = useState(() => {
    try {
      const c = JSON.parse(localStorage.getItem(ICS_CACHE_KEY)||'{}');
      if (c.url === url && c.data && Date.now() - c.ts < ICS_CACHE_TTL) {
        return c.data.map(e => ({ ...e, start: new Date(e.start) }));
      }
    } catch {}
    return [];
  });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!url) { setEvents([]); return; }
    try {
      const c = JSON.parse(localStorage.getItem(ICS_CACHE_KEY)||'{}');
      if (c.url === url && c.data && Date.now() - c.ts < ICS_CACHE_TTL) {
        setEvents(c.data.map(e => ({ ...e, start: new Date(e.start) })));
        return;
      }
    } catch {}

    setLoading(true); setError(null);

    // Stagger proxy attempts: try a proxy, and only start the next one if this
    // one fails. Reduces traffic vs. racing all 4 in parallel.
    async function tryProxy(proxyUrl) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6000);
      try {
        const r = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timer);
        if (!r.ok) return null;
        const ct = r.headers.get('content-type') || '';
        let text = '';
        if (ct.includes('json')) {
          const d = await r.json();
          text = d?.contents || '';
        } else {
          text = await r.text();
        }
        if (text.includes('BEGIN:VCALENDAR') || text.includes('BEGIN:VEVENT')) return text;
        return null;
      } catch { clearTimeout(timer); return null; }
    }

    async function fetchFeed() {
      const proxies = [
        `https://ics-proxy.tobitoenz.workers.dev/?url=${encodeURIComponent(url)}`,
        `https://corsproxy.io/?${encodeURIComponent(url)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
        `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
      ];
      let text = null;
      for (const p of proxies) {
        text = await tryProxy(p);
        if (text) break;
      }
      if (text) {
        const parsed = parseICS(text);
        setEvents(parsed);
        try {
          localStorage.setItem(ICS_CACHE_KEY, JSON.stringify({
            url, ts: Date.now(),
            data: parsed.map(e => ({ ...e, start: e.start.toISOString() }))
          }));
        } catch {}
      } else {
        setError('Could not load feed. Please check the URL.');
      }
      setLoading(false);
    }
    fetchFeed();
  }, [url]);

  return { events, loading, error };
}

function useModalLock(open) {
  useEffect(() => {
    if (!open) return;
    const scrollY = window.scrollY || document.documentElement.scrollTop;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${scrollY}px`;
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.overflow = 'hidden';
    return () => {
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.left = '';
      document.body.style.right = '';
      document.body.style.overflow = '';
      window.scrollTo(0, scrollY);
    };
  }, [open]);
}

/* ════════════════════════════════════════════════════════════════
   EVENTS PAGE
════════════════════════════════════════════════════════════════ */
function EventsPage({ icsUrl, manualEvents, onSaveEvent, onDeleteEvent, onCreateSession }) {
  const { events: icsEvents, loading, error } = useICSFeed(icsUrl);
  const [selected, setSelected] = useState(null);
  const [editEvent, setEditEvent] = useState(null);
  const now = new Date();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  useModalLock(!!(selected || editEvent));

  // Manual events: derive a stable id even if the stored one is missing,
  // so entries never silently disappear.
  const manualNorm = manualEvents.map((ev, idx) => {
    const dateStart = ev.dateStart || ev.date || '';
    if (!ev.name || !dateStart) return null;
    return {
      uid: ev.id || `manual-${idx}-${dateStart}-${ev.name}`,
      title: ev.name,
      location: ev.ort || '',
      notes: ev.notes || '',
      date: dateStart,
      dateEnd: ev.dateEnd || dateStart,
      start: new Date(dateStart + 'T00:00:00'),
      allDay: true,
      source: 'manual',
      _raw: ev.id ? ev : { ...ev, id: ev.id || `manual-${idx}-${dateStart}-${ev.name}` },
    };
  }).filter(Boolean);

  const normalize = s => s.toLowerCase().replace(/[^a-z0-9]/g,'');
  const manualDeduped = manualNorm.filter(m =>
    !icsEvents.some(ics =>
      ics.date === m.date && normalize(ics.title) === normalize(m.title)
    )
  );

  const allEvents = [...manualDeduped, ...icsEvents].sort((a,b) => a.start - b.start);
  const upcoming = allEvents.filter(e => (e.dateEnd || e.date) >= todayStr);
  const past     = allEvents.filter(e => (e.dateEnd || e.date) < todayStr);

  function fmtDateRange(ev) {
    const opts = { weekday:'short', day:'numeric', month:'short', year:'numeric' };
    const s = new Date(ev.date+'T00:00:00').toLocaleDateString('de-CH', opts);
    if (!ev.dateEnd || ev.dateEnd === ev.date) return s;
    const e = new Date(ev.dateEnd+'T00:00:00').toLocaleDateString('de-CH', opts);
    return `${s} – ${e}`;
  }
  function daysUntil(ev) {
    const diff = Math.ceil((new Date(ev.date+'T00:00:00') - now) / (1000*60*60*24));
    if (diff <= 0 && (ev.dateEnd||ev.date) >= todayStr) return 'Ongoing';
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff < 0)  return `${Math.abs(diff)}d ago`;
    return `in ${diff} days`;
  }

  function EventCard({ ev, showBadge }) {
    const isPast = (ev.dateEnd||ev.date) < todayStr;
    const isManual = ev.source === 'manual';
    return (
      <div onClick={()=> isManual ? setEditEvent(ev._raw) : setSelected(ev)}
        style={{
          background:'var(--card)', border:'1px solid var(--border)', borderRadius:12,
          padding:'12px 14px', marginBottom:8, cursor:'pointer',
          borderLeft:`3px solid ${isPast ? 'var(--border)' : isManual ? 'var(--accent)' : 'var(--accent2)'}`,
          opacity: isPast ? 0.6 : 1
        }}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
          <div style={{flex:1}}>
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
              <span style={{fontSize:11,color: isManual ? 'var(--accent)' : 'var(--accent2)',
                fontFamily:'DM Mono,monospace',letterSpacing:.5}}>
                {isManual ? '📌 MANUAL' : '📅 CALENDAR'}
              </span>
            </div>
            <div style={{fontWeight:700,fontSize:15,marginBottom:3}}>{ev.title}</div>
            <div style={{fontSize:12,color:'var(--muted)',fontFamily:'DM Mono,monospace'}}>{fmtDateRange(ev)}</div>
            {ev.location && <div style={{fontSize:12,color:'var(--muted)',marginTop:3}}>📍 {ev.location}</div>}
          </div>
          {showBadge && !isPast && (
            <div style={{background:'var(--accent)',color:'#111',borderRadius:20,
              padding:'3px 10px',fontSize:11,fontFamily:'DM Mono,monospace',
              fontWeight:700,whiteSpace:'nowrap',alignSelf:'center'}}>
              {daysUntil(ev)}
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div>
      <button className="btn btn-primary" style={{width:'100%',marginBottom:12,marginTop:4}}
        onClick={()=>setEditEvent({})}>
        + Add competition
      </button>

      {loading && <div style={{padding:16,textAlign:'center',color:'var(--muted)',fontFamily:'DM Mono,monospace'}}>Loading calendar…</div>}
      {error && <div style={{padding:'8px 0',color:'var(--red)',fontFamily:'DM Mono,monospace',fontSize:12}}>{error}</div>}

      {!loading && allEvents.length === 0 && (
        <div className="empty">
          <div className="empty-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
          </div>
          <div className="empty-text">No events yet.<br/>Add a competition or connect an ICS feed in Settings.</div>
        </div>
      )}

      {upcoming.length > 0 && (
        <div>
          <div style={{fontSize:11,color:'var(--muted)',fontFamily:'DM Mono,monospace',letterSpacing:1,margin:'4px 0 8px'}}>UPCOMING</div>
          {upcoming.map(ev=><EventCard key={ev.uid} ev={ev} showBadge={true}/>)}
        </div>
      )}
      {past.length > 0 && (
        <div>
          <div style={{fontSize:11,color:'var(--muted)',fontFamily:'DM Mono,monospace',letterSpacing:1,margin:'16px 0 8px'}}>PAST</div>
          {past.slice(0,15).map(ev=><EventCard key={ev.uid} ev={ev} showBadge={false}/>)}
        </div>
      )}

      {selected && (
        <div onClick={()=>setSelected(null)} style={{
          position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',
          zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:'24px 16px'
        }}>
          <div onClick={e=>e.stopPropagation()} style={{
            background:'var(--card)',borderRadius:20,width:'100%',maxWidth:420,
            boxShadow:'0 24px 64px rgba(0,0,0,0.7)',overflow:'hidden',border:'1px solid var(--border)'
          }}>
            <div style={{background:'var(--accent)',padding:'16px 16px 14px',
              display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
              <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:18,color:'#111',lineHeight:1.3,flex:1,letterSpacing:.5}}>{selected.title}</div>
              <button onClick={()=>setSelected(null)} style={{
                background:'#c0392b',border:'none',borderRadius:10,width:36,height:36,
                fontSize:22,fontWeight:700,color:'#fff',cursor:'pointer',
                display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>×</button>
            </div>
            <div style={{padding:'16px 18px 20px'}}>
              <div style={{fontFamily:'DM Mono,monospace',fontSize:13,color:'var(--muted)',marginBottom:10}}>
                📅 {fmtDateRange(selected)}
              </div>
              {selected.location && <div style={{fontSize:14,marginBottom:10}}>📍 {selected.location}</div>}
              {selected.notes && (
                <div style={{background:'var(--surface)',borderRadius:10,padding:'10px 12px',
                  fontSize:13,color:'var(--text)',marginBottom:16,lineHeight:1.6}}>
                  {selected.notes}
                </div>
              )}
              <button className="btn btn-primary" style={{width:'100%',marginTop:4,fontSize:14,padding:'13px'}}
                onClick={()=>{
                  onCreateSession({ date:selected.date, name:selected.title, ort:selected.location, type:'competition' });
                  setSelected(null);
                }}>🏆 Create session</button>
              <a href={makeGCalUrl({title:selected.title,date:selected.date,location:selected.location,notes:selected.notes})}
                target="_blank" rel="noopener noreferrer"
                style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,
                  marginTop:8,padding:'11px',borderRadius:12,border:'1px solid var(--border)',
                  background:'var(--surface)',color:'var(--text)',textDecoration:'none',
                  fontFamily:'DM Mono,monospace',fontSize:13,fontWeight:600}}>
                <img src="https://www.gstatic.com/images/branding/product/1x/calendar_2020q4_32dp.png"
                  style={{width:18,height:18}} alt=""/>
                Add to Google Calendar
              </a>
            </div>
          </div>
        </div>
      )}

      {editEvent !== null && (
        <EventFormModal
          existing={editEvent?.id ? editEvent : null}
          onSave={ev=>{ onSaveEvent(ev); setEditEvent(null); }}
          onDelete={id=>{ onDeleteEvent(id); setEditEvent(null); }}
          onClose={()=>setEditEvent(null)}
          onCreateSession={onCreateSession}
        />
      )}
    </div>
  );
}

const FIELD_CONFIG_KEY = 'claylog_fieldconfig';
let _fieldConfigCache = null;
function loadFieldConfig() {
  if (_fieldConfigCache !== null) return _fieldConfigCache;
  try {
    const saved = JSON.parse(localStorage.getItem(FIELD_CONFIG_KEY) || 'null');
    if (saved) { _fieldConfigCache = saved; return saved; }
  } catch {}
  _fieldConfigCache = Object.fromEntries(OPTIONAL_FIELDS.map(f => [f.id, true]));
  return _fieldConfigCache;
}
function saveFieldConfig(cfg) {
  _fieldConfigCache = cfg;
  try { localStorage.setItem(FIELD_CONFIG_KEY, JSON.stringify(cfg)); } catch {}
}

function FormModeSettings() {
  const [cfg, setCfg] = useState(() => loadFieldConfig());
  function toggle(id) {
    const next = { ...cfg, [id]: !cfg[id] };
    setCfg(next);
    saveFieldConfig(next);
  }
  return (
    <div>
      {OPTIONAL_FIELDS.map(f => {
        const on = cfg[f.id] !== false;
        return (
          <div key={f.id} onClick={()=>toggle(f.id)} style={{
            display:'flex', alignItems:'center', justifyContent:'space-between',
            padding:'10px 14px', borderRadius:12, border:'1px solid var(--border)',
            background: on ? 'rgba(255,255,255,0.04)' : 'var(--surface)',
            marginBottom:8, cursor:'pointer', transition:'all .15s'
          }}>
            <span style={{fontSize:15,fontWeight:600,color: on ? 'var(--text)' : 'var(--muted)'}}>{f.label}</span>

                left: on ? 21 : 3,
                width:20, height:20, borderRadius:'50%',
                background: on ? '#000' : 'var(--muted)',
                transition:'left .2s'
              }}/>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function loadNavHidden() {
  try { return JSON.parse(localStorage.getItem('claylog_navhidden') || '{}'); }
  catch { return {}; }
}
function saveNavHidden(obj) {
  try { localStorage.setItem('claylog_navhidden', JSON.stringify(obj)); } catch {}
}

function BottomNav({ active, onChange }) {
  const [hidden, setHidden] = useState(() => loadNavHidden());
  useEffect(() => {
    function onchange() { setHidden(loadNavHidden()); }
    window.addEventListener('navhiddenchange', onchange);
    return () => window.removeEventListener('navhiddenchange', onchange);
  }, []);
  const visible = NAV_ITEMS.filter(item => !hidden[item.id]);
  return (
    <nav className="bottom-nav">
      {visible.map(item => (
        <div key={item.id} className={`nav-item ${active===item.id?'active':''}`} onClick={()=>onChange(item.id)}>
          {NAV_ICONS[item.icon]}
          <div className="nav-label">{item.label}</div>
        </div>
      ))}
    </nav>
  );
}

        {isComp ? '🏆' : '🏋️'}
      </div>
      <div className="session-info">
        <div className="session-name">{s.name || s.disziplin || 'Practice'}</div>
        <div className="session-meta">
          {s.name && <span style={{color:'var(--muted)',marginRight:4}}>{s.disziplin} · </span>}
          {fmtDate(s.date)}{s.ort ? ` · ${s.ort}` : ''}{s.waffe ? ` · ${s.waffe}` : ''}
        </div>
      </div>
      {hasScore && (
        <div className="session-score">
          {s.score}<span className="score-max">/{s.max}</span>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   CHART HELPERS
════════════════════════════════════════════════════════════════ */
function smoothPath(pts) {
  if (!pts.length) return '';
  if (pts.length < 3) {
    return pts.map((p,i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  }
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i-1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[i+2] || p2;
    const t = 0.16;
    const c1x = p1.x + (p2.x - p0.x) * t;
    const c1y = p1.y + (p2.y - p0.y) * t;
    const c2x = p2.x - (p3.x - p1.x) * t;
    const c2y = p2.y - (p3.y - p1.y) * t;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}
function ChartDefs({ id, colors = [] }) {
  return (
    <defs>
      {colors.map((c, i) => (
        <linearGradient key={i} id={`${id}-grad-${i}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={c} stopOpacity="0.28"/>
          <stop offset="60%" stopColor={c} stopOpacity="0.08"/>
          <stop offset="100%" stopColor={c} stopOpacity="0"/>
        </linearGradient>
      ))}
      <filter id={`${id}-glow`} x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="2.2" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  );
}
function nearestPointIdx(evt, svgEl, pts, viewW) {
  if (!svgEl || !pts.length) return null;
  const rect = svgEl.getBoundingClientRect();
  const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
  const xView = ((clientX - rect.left) / rect.width) * viewW;
  let best = 0, bestD = Infinity;
  pts.forEach((p, i) => {
    const d = Math.abs(p.x - xView);
    if (d < bestD) { bestD = d; best = i; }
  });
  return best;
}

/* ════════════════════════════════════════════════════════════════
   MUNITIONS CHARTS (bug: removed unused `scale` prop)
════════════════════════════════════════════════════════════════ */
function MunitionsChartCumulative({ monthlyData, currentMonth }) {
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const svgRef = React.useRef(null);
  const [sel, setSel] = React.useState(null);
  const theme = useThemeColors();

  let cum = 0;
  const cumData = monthlyData.map(v => { cum += v; return cum; });
  const cumMax = Math.max(cumData[cumData.length-1], 1);
  const lastIdx = monthlyData.reduce((last, v, i) => v > 0 ? i : last, 0);

  const W = 280, H = 140;
  const padL = 8, padR = 8, padT = 18, padB = 24;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  function toX(i) { return padL + (i / 11) * chartW; }
  function toY(v) { return padT + chartH - (v / cumMax) * chartH; }

  const pts = cumData.slice(0, lastIdx + 1).map((v, i) => ({ x: toX(i), y: toY(v), v, i }));
  const linePath = smoothPath(pts);
  const areaPath = pts.length > 0
    ? `M${toX(0)},${padT+chartH} ` + smoothPath(pts).replace(/^M/, 'L') + ` L${toX(lastIdx)},${padT+chartH} Z`
    : '';

  function handleMove(e) {
    const idx = nearestPointIdx(e, svgRef.current, pts, W);
    if (idx !== null) setSel(idx);
  }
  function niceRound(v) {
    if (v === 0) return 0;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    return Math.round(v / mag) * mag;
  }
  const gridVals = [0.25, 0.5, 0.75].map(f => niceRound(cumMax * f)).filter((v,i,a) => a.indexOf(v) === i && v > 0);
  const selPt = sel !== null ? pts[sel] : null;

  return (
    <div style={{position:'relative'}}>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:'100%',display:'block',overflow:'visible',touchAction:'pan-y'}}
        onTouchStart={handleMove} onTouchMove={handleMove} onMouseMove={handleMove} onMouseLeave={()=>setSel(null)}>
        <ChartDefs id="cum" colors={[theme.accent2]} />
        {gridVals.map(v => (
          <g key={v}>
            <line x1={padL} y1={toY(v)} x2={W-padR} y2={toY(v)}
              stroke="#2a2a3a" strokeWidth="1" strokeDasharray="3,4"/>
            <text x={padL} y={toY(v)-3} textAnchor="start"
              fill="#7a7a98" fontSize="9" fontFamily="DM Mono,monospace">
              {v >= 1000 ? (v/1000).toFixed(0)+'k' : v}
            </text>
          </g>
        ))}
        {areaPath && <path d={areaPath} fill="url(#cum-grad-0)"/>}
        {monthlyData.map((val, i) => {
          if (i > lastIdx) return null;
          const barW = chartW / 12 * 0.5;
          const bx = toX(i) - barW/2;
          const bh = (val / cumMax) * chartH;
          const isCur = i === currentMonth;
          return val > 0 ? (
            <rect key={i} x={bx} y={padT+chartH-bh} width={barW} height={bh}
              fill={isCur ? 'rgba(232,200,74,0.35)' : 'rgba(74,100,130,0.3)'} rx="1"/>
          ) : null;
        })}
        {linePath && <path d={linePath} fill="none" stroke={theme.accent2} strokeWidth="3" strokeLinejoin="round" strokeLinecap="round" filter="url(#cum-glow)"/>}
        {selPt && <line x1={selPt.x} y1={padT} x2={selPt.x} y2={padT+chartH} stroke={theme.accent2} strokeWidth="1" strokeDasharray="2,3" strokeOpacity="0.5"/>}
        {pts.map((p, i) => {
          const isCur = p.i === currentMonth;
          const isSel = sel === i;
          return (
            <circle key={i} cx={p.x} cy={p.y} r={isSel ? 6 : isCur ? 4.5 : 3.5}
              fill={isCur ? theme.accent : theme.accent2}
              stroke={isSel ? '#fff' : 'none'} strokeWidth={isSel ? 1.5 : 0}
            />
          );
        })}
        {monthlyData.map((_, i) => (
          <text key={i} x={toX(i)} y={H-6} textAnchor="middle"
            fill={i===currentMonth ? theme.accent : '#7a7a98'}
            fontSize="9" fontFamily="DM Mono,monospace"
            fontWeight={i===currentMonth?'bold':'normal'}>
            {MONTHS[i].slice(0,1)}
          </text>
        ))}
      </svg>
      {selPt && (
        <div style={{
          position:'absolute', top:0, left:`${(selPt.x/W)*100}%`,
          transform:`translateX(${selPt.x > W*0.6 ? '-105%' : '5%'})`,
          background:'var(--surface)', border:`1px solid ${theme.accent2}`,
          borderRadius:8, padding:'4px 9px', pointerEvents:'none',
          fontFamily:'DM Mono,monospace', fontSize:11, whiteSpace:'nowrap', zIndex:5
        }}>
          <span style={{color:'var(--muted)'}}>{MONTHS[selPt.i]} · </span>
          <span style={{color:theme.accent2,fontWeight:'bold'}}>{selPt.v.toLocaleString()}</span>
        </div>
      )}
    </div>
  );
}

function MunitionsChartHeatmap({ monthlyData, maxVal, currentMonth }) {
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const [active, setActive] = useState(null);
  const theme = useThemeColors();

  const COLS = 4, ROWS = 3;
  const W = 260, H = 140;
  const padL = 4, padR = 4, padT = 4, padB = 4;
  const cellW = (W - padL - padR) / COLS;
  const cellH = (H - padT - padB) / ROWS;

  function hexToRgbLocal(hex) {
    const h = hex.replace('#','');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  const [ar, ag, ab] = hexToRgbLocal(theme.accent);

  function getColor(val) {
    if (val === 0) return '#1a1a24';
    const intensity = val / maxVal;
    const r1=26,g1=26,b1=36;
    const r = Math.round(r1 + (ar-r1)*intensity);
    const g = Math.round(g1 + (ag-g1)*intensity);
    const b = Math.round(b1 + (ab-b1)*intensity);
    return `rgb(${r},${g},${b})`;
  }

  return (
    <div style={{position:'relative'}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',display:'block'}}>
        {monthlyData.map((val, i) => {
          const col = i % COLS;
          const row = Math.floor(i / COLS);
          const x = padL + col * cellW;
          const y = padT + row * cellH;
          const isCur = i === currentMonth;
          const isActive = active === i;
          const fillColor = getColor(val);
          const textColor = val/maxVal > 0.5 ? '#0a0a0c' : '#9a9abb';
          return (
            <g key={i}
              onMouseEnter={() => setActive(i)}
              onMouseLeave={() => setActive(null)}
              onTouchStart={() => setActive(active===i ? null : i)}
              style={{cursor:'pointer'}}>
              <rect x={x+2} y={y+2} width={cellW-4} height={cellH-4}
                fill={fillColor} rx="6"
                stroke={isCur ? theme.accent : 'transparent'}
                strokeWidth="1.5"/>
              <text x={x + cellW/2} y={y + cellH*0.38}
                textAnchor="middle" fill={val>0 ? textColor : '#3a3a5a'}
                fontSize="8" fontFamily="DM Mono,monospace">
                {MONTHS[i]}
              </text>
              <text x={x + cellW/2} y={y + cellH*0.72}
                textAnchor="middle"
                fill={val>0 ? (val/maxVal>0.5 ? '#0a0a0c' : theme.accent) : '#2a2a3a'}
                fontSize={isActive ? "9" : "8"} fontWeight="bold"
                fontFamily="DM Mono,monospace">
                {val > 0 ? val.toLocaleString() : '·'}
              </text>
            </g>
          );
        })}
      </svg>
      <div style={{display:'flex',alignItems:'center',gap:6,marginTop:4,justifyContent:'flex-end'}}>
        <span style={{fontSize:9,color:'#6a6a88',fontFamily:'DM Mono,monospace'}}>0</span>
        <svg width="60" height="8" style={{borderRadius:4,overflow:'hidden'}}>
          <defs>
            <linearGradient id="heatGrad" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0%" stopColor="#1a1a24"/>
              <stop offset="100%" stopColor={theme.accent}/>
            </linearGradient>
          </defs>
          <rect width="60" height="8" fill="url(#heatGrad)" rx="2"/>
        </svg>
        <span style={{fontSize:9,color:'#6a6a88',fontFamily:'DM Mono,monospace'}}>{maxVal.toLocaleString()}</span>
      </div>
    </div>
  );
}

function MunitionsChart({ sessions, year, variant = 'full' }) {
  const [chartType, setChartType] = useState(() => {
    try { return localStorage.getItem('claylog_shellchart') || 'cumulative'; } catch { return 'cumulative'; }
  });
  const monthlyData = Array(12).fill(0);
  sessions.filter(s => (s.date||'').startsWith(year))
    .forEach(s => {
      const m = parseInt((s.date||'').slice(5,7)) - 1;
      if (m >= 0 && m < 12) monthlyData[m] += s.munition || 0;
    });
  const maxVal = Math.max(...monthlyData, 1);
  const currentMonth = new Date().getMonth();
  const total = monthlyData.reduce((a,v) => a+v, 0);
  const isMini = variant === 'mini';

  function setType(t) {
    setChartType(t);
    try { localStorage.setItem('claylog_shellchart', t); } catch {}
  }
  if (isMini) {
    return (
      <div className="card" style={{marginBottom:0}}>
        <div className="card-header" style={{marginBottom:4}}>
          <span className="card-title" style={{fontSize:12}}>Shells {year}</span>
          <span style={{fontFamily:'DM Mono,monospace',fontSize:11,color:'var(--accent)'}}>{total.toLocaleString()}</span>
        </div>
        <MunitionsChartHeatmap monthlyData={monthlyData} maxVal={maxVal} currentMonth={currentMonth}/>
      </div>
    );
  }
  return (
    <div className="card" style={{marginBottom:12}}>
      <div className="card-header">
        <span className="card-title">Shells fired {year}</span>
        <span style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:18,color:'var(--accent)',letterSpacing:0.5}}>{total.toLocaleString()}</span>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:10}}>
        {[['cumulative','📈 Cumul.'],['horizontal','≡ Bars']].map(([t,l]) => (
          <button key={t}
            className={`analyse-tab ${chartType===t?'active':''}`}
            style={{fontSize:11,padding:'4px 10px'}}
            onClick={() => setType(t)}>{l}</button>
        ))}
      </div>
      {total === 0 ? (
        <div className="empty" style={{padding:'20px 0'}}>
          <div className="empty-text">No shell data for {year}.</div>
        </div>
      ) : chartType === 'cumulative' ? (
        <MunitionsChartCumulative monthlyData={monthlyData} currentMonth={currentMonth}/>
      ) : (
        <MunitionsChartHorizontal monthlyData={monthlyData} maxVal={maxVal} currentMonth={currentMonth}/>
      )}
    </div>
  );
}

const DEFAULT_BLOCKS = [
  { id: 'stats',     label: 'Stats',          visible: true  },
  { id: 'nextEvent', label: 'Next Event',      visible: true  },
  { id: 'shells',    label: 'Shells Fired',    visible: true  },
  { id: 'score',     label: 'Score (mini)',    visible: false },
  { id: 'recent',    label: 'Recent',          visible: true  },
];
const BLOCKS_KEY = 'claylog_blocks';
let _blocksCache = null;
function loadBlocks() {
  if (_blocksCache !== null) return _blocksCache;
  try {
    const s = localStorage.getItem(BLOCKS_KEY);
    if (!s) { _blocksCache = DEFAULT_BLOCKS; return _blocksCache; }
    const saved = JSON.parse(s);
    const merged = saved.filter(b => DEFAULT_BLOCKS.find(d => d.id === b.id));
    DEFAULT_BLOCKS.forEach(d => { if (!merged.find(b => b.id === d.id)) merged.push(d); });
    _blocksCache = merged;
    return merged;
  } catch { _blocksCache = DEFAULT_BLOCKS; return _blocksCache; }
}
function saveBlocks(blocks) {
  _blocksCache = blocks;
  try { localStorage.setItem(BLOCKS_KEY, JSON.stringify(blocks)); } catch {}
}

function Dashboard({ sessions, onSessionClick, icsUrl, onCreateSession, manualEvents, editMode }) {
  const year = new Date().getFullYear();
  const yearSessions = sessions.filter(s => (s.date||'').startsWith(year));
  const compYear  = sessions.filter(s => s.type==='competition' && s.max>0 && (s.date||'').startsWith(year));
  const compAllTotal = sessions.filter(s => s.type==='competition');
  const quoteYear = compYear.length  ? Math.round(compYear.reduce((a,s)=>a+s.score/s.max,0)/compYear.length*1000)/10 : null;
  const compAll   = sessions.filter(s => s.type==='competition' && s.max>0);
  const quoteAll  = compAll.length   ? Math.round(compAll.reduce((a,s)=>a+s.score/s.max,0)/compAll.length*1000)/10  : null;
  const recent    = [...sessions].sort((a,b) => b.date > a.date ? 1 : -1).slice(0, 2);
  const now = new Date();

  const { events: icsEvents } = useICSFeed(icsUrl);
  const todayD = now.toISOString().slice(0,10);
  const manualUpcoming = manualEvents
    .filter(e => (e.dateEnd||e.dateStart) >= todayD)
    .map(e => ({ title:e.name, location:e.ort||'', date:e.dateStart, start:new Date(e.dateStart+'T00:00:00'), allDay:true }));
  const normTitle = s => s.toLowerCase().replace(/[^a-z0-9]/g,'');
  const icsUpcoming = icsEvents.filter(e => e.date >= todayD);
  const manualUpcomingDeduped = manualUpcoming.filter(m =>
    !icsUpcoming.some(e => e.date === m.date && normTitle(e.title) === normTitle(m.title))
  );
  const allUpcoming = [...manualUpcomingDeduped, ...icsUpcoming].sort((a,b)=>a.start-b.start);
  const nextEvent = allUpcoming[0] || null;

  const [blocks, setBlocks]     = useState(() => loadBlocks());
  const [dragging, setDragging] = useState(null);
  const [dragOver, setDragOver] = useState(null);

  function updateBlocks(next) { setBlocks(next); saveBlocks(next); }
  function toggleVisible(id) {
    updateBlocks(blocks.map(b => b.id === id ? { ...b, visible: !b.visible } : b));
  }
  function moveBlock(fromId, toId) {
    if (fromId === toId) return;
    const next = [...blocks];
    const fi = next.findIndex(b => b.id === fromId);
    const ti = next.findIndex(b => b.id === toId);
    const [item] = next.splice(fi, 1);
    next.splice(ti, 0, item);
    updateBlocks(next);
  }
  function onDragStart(id) { setDragging(id); }
  function onDragEnd()     { setDragging(null); setDragOver(null); }
  function onDragOver(e, id) { e.preventDefault(); setDragOver(id); }
  function onDrop(e, id)   { e.preventDefault(); if (dragging) moveBlock(dragging, id); setDragging(null); setDragOver(null); }

  const touchDragId = useRef(null);
  function onTouchStartDrag(e, id) { touchDragId.current = id; }
  function onTouchMoveDrag(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const blockEl = el?.closest('[data-block-id]');
    if (blockEl) setDragOver(blockEl.dataset.blockId);
  }
  function onTouchEndDrag() {
    if (touchDragId.current && dragOver && touchDragId.current !== dragOver) {
      moveBlock(touchDragId.current, dragOver);
    }
    touchDragId.current = null;
    setDragOver(null);
  }

  const blockContent = {
    score: <UnifiedScoreChart sessions={sessions} variant="mini" />,
    nextEvent: nextEvent ? (
      <div className="card card-elev" style={{marginBottom:0,borderLeft:'3px solid var(--accent)'}}>
        <div style={{fontSize:11,color:'var(--muted)',fontFamily:'DM Mono,monospace',letterSpacing:1,marginBottom:6}}>NEXT COMPETITION</div>
        <div style={{fontWeight:700,fontSize:16,marginBottom:4}}>{nextEvent.title}</div>
        <div style={{fontSize:12,color:'var(--muted)',fontFamily:'DM Mono,monospace',marginBottom:nextEvent.location?4:0}}>
          {nextEvent.start.toLocaleDateString('de-CH',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
          {!nextEvent.allDay && ' · '+nextEvent.start.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})}
        </div>
        {nextEvent.location && <div style={{fontSize:12,color:'var(--muted)'}}>📍 {nextEvent.location}</div>}
        <div style={{display:'flex',gap:8,marginTop:10}}>
          <div style={{background:'var(--accent)',color:'#111',borderRadius:20,padding:'3px 12px',fontSize:11,fontFamily:'DM Mono,monospace',fontWeight:700}}>
            {Math.ceil((nextEvent.start-now)/(1000*60*60*24))===0?'Today':Math.ceil((nextEvent.start-now)/(1000*60*60*24))===1?'Tomorrow':`in ${Math.ceil((nextEvent.start-now)/(1000*60*60*24))} days`}
          </div>
          <button className="btn btn-ghost" style={{padding:'4px 12px',fontSize:11,margin:0,textTransform:'none',letterSpacing:0}} onClick={()=>onCreateSession({date:nextEvent.date,name:nextEvent.title,ort:nextEvent.location,type:'competition'})}>
            + Session
          </button>
        </div>
      </div>
    ) : null,
    stats: (
      <div className="stat-grid">
        <div className="stat-box">
          <div className="stat-val">
            {yearSessions.length}
            <span style={{fontSize:'0.45em',color:'var(--muted)',fontWeight:500,fontFamily:'DM Mono,monospace'}}> / {sessions.length}</span>
          </div>
          <div className="stat-label">Sessions {year}</div>
        </div>
        <div className="stat-box"><div className="stat-val">{quoteYear !== null ? quoteYear+'%' : '–'}</div><div className="stat-label">🏆 Ø {year}</div></div>
        <div className="stat-box">
          <div className="stat-val">
            {compYear.length}
            <span style={{fontSize:'0.45em',color:'var(--muted)',fontWeight:500,fontFamily:'DM Mono,monospace'}}> / {compAllTotal.length}</span>
          </div>
          <div className="stat-label">🏆 Competitions</div>
        </div>
        <div className="stat-box"><div className="stat-val">{quoteAll !== null ? quoteAll+'%' : '–'}</div><div className="stat-label">Ø All time</div></div>
      </div>
    ),
    shells: <MunitionsChart sessions={sessions} year={year} />,
    recent: (
      <div className="card" style={{padding:'10px 12px'}}>
        <div className="card-header" style={{marginBottom:6}}><span className="card-title">Recent</span></div>
        {recent.length === 0 ? (
          <div className="empty">
            <div className="empty-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
            </div>
            <div className="empty-text">No entries yet.</div>
            <button className="btn btn-primary" style={{width:'auto',padding:'10px 20px',margin:'0 auto',display:'inline-block'}} onClick={onCreateSession}>+ Add first session</button>
          </div>
        ) : (
          recent.map(s => <SessionItem key={s.id} s={s} onClick={() => editMode ? null : onSessionClick(s)} />)
        )}
      </div>
    ),
  };

  return (
    <div>
      {blocks.map(block => {
        const isDraggingThis = dragging === block.id;
        const isDragTarget   = dragOver === block.id && dragging !== block.id;
        return (
          <div
            key={block.id}
            data-block-id={block.id}
            draggable={editMode}
            onDragStart={() => onDragStart(block.id)}
            onDragEnd={onDragEnd}
            onDragOver={e => onDragOver(e, block.id)}
            onDrop={e => onDrop(e, block.id)}
            onTouchStart={editMode ? e => onTouchStartDrag(e, block.id) : undefined}
            onTouchMove={editMode ? onTouchMoveDrag : undefined}
            onTouchEnd={editMode ? onTouchEndDrag : undefined}
            style={{
              opacity: isDraggingThis ? 0.4 : 1,
              transform: isDragTarget ? 'scale(1.02)' : 'scale(1)',
              transition: 'transform .15s, opacity .15s',
              outline: isDragTarget ? '2px solid var(--accent)' : 'none',
              borderRadius: 12,
              display: (!editMode && !block.visible) ? 'none' : 'block',
              position: 'relative',
            }}>
            {editMode && (
              <div style={{
                position:'absolute', top:8, right:8, zIndex:10,
                display:'flex', gap:6, alignItems:'center'
              }}>
                <div onClick={() => toggleVisible(block.id)} style={{
                  cursor:'pointer', background:'var(--card)',
                  border:'1px solid var(--border)', borderRadius:8,
                  padding:'4px 8px', fontSize:11,
                  fontFamily:'DM Mono,monospace',
                  color: block.visible ? 'var(--accent)' : 'var(--muted)'
                }}>
                  {block.visible ? '● Show' : '○ Hide'}
                </div>
                <div style={{
                  cursor:'grab', background:'var(--card)',
                  border:'1px solid var(--border)', borderRadius:8,
                  padding:'4px 8px', fontSize:16, lineHeight:1,
                  color:'var(--muted)', userSelect:'none'
                }}>⠿</div>
              </div>
            )}
            <div style={{
              animation: editMode ? 'wiggle .4s infinite alternate' : 'none',
              opacity: editMode && !block.visible ? 0.4 : 1,
            }}>
              {blockContent[block.id]}
            </div>
          </div>
        );
      })}
    </div>
  );
}

  const orte = [...new Set(sessions.map(s => s.ort).filter(Boolean))].sort();

  const hasFilter = filter.type || filter.disziplin || filter.waffe || filter.ort || filter.munition;

  const filtered = sessions
    .filter(s => !filter.type || s.type === filter.type)
    .filter(s => !filter.disziplin || s.disziplin === filter.disziplin)
    .filter(s => !filter.waffe || s.waffe === filter.waffe)
    .filter(s => !filter.ort || s.ort === filter.ort)
    .filter(s => !filter.munition || s.munition_typ === filter.munition)
    .sort((a,b) => b.date > a.date ? 1 : -1);

  const grouped = {};
  filtered.forEach(s => {
    const d = new Date(s.date);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    const label = d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    if (!grouped[key]) grouped[key] = { label, sessions: [] };
    grouped[key].sessions.push(s);
  });
  const groupKeys = Object.keys(grouped).sort((a,b) => b.localeCompare(a));

  return (
    <div>
      <div style={{display:'flex',gap:8,marginBottom:12,alignItems:'center'}}>
        <button className={`analyse-tab ${showFilter?'active':''}`} onClick={()=>setShowFilter(f=>!f)} style={{flexShrink:0}}>
          🔽 Filter{hasFilter ? ' ●' : ''}

        {hasFilter && (
          <button className="analyse-tab" onClick={()=>setFilter({type:'',disziplin:'',waffe:'',ort:'',munition:''})}>✕ Reset</button>
        )}
        <span style={{fontSize:11,color:'var(--muted)',fontFamily:'DM Mono,monospace',marginLeft:'auto'}}>{filtered.length} sessions</span>
      </div>
      {showFilter && (
        <div className="card" style={{marginBottom:12,padding:'12px 14px'}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            <div>
              <label>Type</label>
              <select value={filter.type} onChange={e=>setFilter(f=>({...f,type:e.target.value}))}>
                <option value="">All</option>
                <option value="practice">Practice</option>
                <option value="competition">Competition</option>
              </select>
            </div>
            <div>
              <label>Discipline</label>
              <select value={filter.disziplin} onChange={e=>setFilter(f=>({...f,disziplin:e.target.value}))}>

            </div>

              <label>Gun</label>
              <select value={filter.waffe} onChange={e=>setFilter(f=>({...f,waffe:e.target.value}))}>
                <option value="">All</option>
                {waffen.map(w => <option key={w}>{w}</option>)}
              </select>
            </div>
            <div>
              <label>Location</label>
              <select value={filter.ort} onChange={e=>setFilter(f=>({...f,ort:e.target.value}))}>
                <option value="">All</option>
                {orte.map(o => <option key={o}>{o}</option>)}

            <div style={{gridColumn:'1/-1'}}>

              <select value={filter.munition} onChange={e=>setFilter(f=>({...f,munition:e.target.value}))}>
