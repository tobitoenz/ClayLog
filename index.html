<style>
/* ─── DESIGN TOKENS ─────────────────────────────────────────── */
:root {
  --bg: #0a0a0c;
  --surface: #13131a;
  --card: #1a1a24;
  --border: #2a2a3a;
  --accent: #e8c84a;
  --accent2: #4ae8c8;
  --red: #e84a4a;
  --text: #f0f0f8;
  --muted: #6a6a88;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; max-width: 100vw; }

/* ─── APP SHELL ─────────────────────────────────────────────── */
#root { height: 100%; }
.app { display: flex; flex-direction: column; height: 100dvh; }

/* ─── HEADER ────────────────────────────────────────────────── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px;
  background: linear-gradient(180deg, #0d0d18 0%, transparent 100%);
  position: relative; z-index: 10; flex-shrink: 0;
}
.header-logo-row { display: flex; align-items: center; gap: 10px; }
.logo { font-family: 'Arial', sans-serif; font-size: 28px; letter-spacing: 3px; color: var(--accent); }
.header-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.sync-status { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }

/* ─── MAIN ──────────────────────────────────────────────────── */
.main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; -webkit-overflow-scrolling: touch; }
.page { display: none; }
.page.active { display: block; }

/* ─── BOTTOM NAV ────────────────────────────────────────────── */
.bottom-nav {
  display: flex; background: var(--surface);
  border-top: 1px solid var(--border); padding: 8px 0 24px; flex-shrink: 0;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 0; cursor: pointer; transition: all .2s; user-select: none;
}
.nav-icon { font-size: 22px; transition: transform .2s; }
.nav-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-family: 'DM Mono', monospace; }
.nav-item.active .nav-icon { transform: scale(1.1); }
.nav-item.active .nav-label { color: var(--accent); }

/* ─── FAB ───────────────────────────────────────────────────── */
.fab {
  position: fixed; bottom: 90px; right: 20px;
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--accent); color: #000;
  font-size: 28px; font-weight: bold;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(232,200,74,.4);
  cursor: pointer; z-index: 100; border: none;
  transition: all .2s;
}
.fab:active { transform: scale(.92); }

/* ─── CARDS ─────────────────────────────────────────────────── */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; margin-bottom: 12px;
}
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: 'DM Mono', monospace; }

/* ─── STAT GRID ─────────────────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-box { background: var(--surface); border-radius: 10px; padding: 14px; border: 1px solid var(--border); }
.stat-val { font-family: 'Arial', sans-serif; font-size: 36px; color: var(--accent); line-height: 1; }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }

/* ─── SESSION ITEMS ─────────────────────────────────────────── */
.session-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 0; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: opacity .15s;
}
.session-item:last-child { border-bottom: none; }
.session-item:active { opacity: .6; }
.session-icon {
  width: 42px; height: 42px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.session-icon.training { background: rgba(232,200,74,.12); }
.session-icon.competition { background: rgba(74,232,200,.12); }
.session-info { flex: 1; min-width: 0; }
.session-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: 'DM Mono', monospace; }
.session-score { font-family: 'Arial', sans-serif; font-size: 28px; color: var(--accent); flex-shrink: 0; }
.score-max { font-size: 13px; color: var(--muted); }

/* ─── EMPTY STATE ───────────────────────────────────────────── */
.empty { text-align: center; padding: 40px 20px; }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { color: var(--muted); font-size: 14px; line-height: 1.6; }

/* ─── MODAL ─────────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.75);
  backdrop-filter: blur(8px); z-index: 200;
  display: flex; align-items: flex-end;
}
.modal {
  background: var(--surface); border-radius: 24px 24px 0 0;
  width: 100%; padding: 16px 16px 36px;
  border: 1px solid var(--border); border-bottom: none;
  animation: slideUp .3s cubic-bezier(.34,1.56,.64,1);
  max-height: 92dvh; overflow-y: auto;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 12px; }
.modal-title { font-family: 'Arial', sans-serif; font-size: 20px; letter-spacing: 2px; margin-bottom: 12px; }

/* ─── FORMS ─────────────────────────────────────────────────── */
.form-group { margin-bottom: 10px; }
label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: 'DM Mono', monospace; margin-bottom: 8px; }
input, select, textarea {
  width: 100%; background: #0e0e18; border: 1px solid var(--border);
  border-left: 3px solid var(--accent2);
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 16px;
  padding: 10px 12px; border-radius: 10px; outline: none;
  -webkit-appearance: none; appearance: none;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.3);
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent); border-left-color: var(--accent);
  box-shadow: inset 0 2px 6px rgba(0,0,0,.3), 0 0 0 2px rgba(232,200,74,.15);
}
select {

}

  background: linear-gradient(180deg, #f0d060 0%, #c8a030 100%);

        ) : (
          <button className="btn btn-primary" onClick={handleRegister} disabled={loading} style={{marginTop:'4px'}}>
            {loading ? '⟳ Loading…' : 'Sign up'}

        </button>
        {mode === 'login' && (
          <button className="auth-forgot" onClick={handleForgot} disabled={loading}>
            Forgot password?
          </button>
        )}

  );
}

/* ════════════════════════════════════════════════════════════════
   DASHBOARD
════════════════════════════════════════════════════════════════ */
function MunitionsChart({ sessions, year }) {
  const canvasRef = useRef(null);
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const monthlyData = Array(12).fill(0);
  sessions
    .filter(s => (s.date||'').startsWith(year))
    .forEach(s => {
      const m = parseInt((s.date||'').slice(5,7)) - 1;
      if (m >= 0 && m < 12) monthlyData[m] += s.munition || 0;
    });

  const maxVal = Math.max(...monthlyData, 1);
  const currentMonth = new Date().getMonth();

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth;
    const H = 140;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    const padL = 36, padR = 8, padT = 8, padB = 28;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;
    const barW = chartW / 12;

    // Grid lines
    [0, 0.5, 1].forEach(v => {
      const y = padT + chartH - v * chartH;
      ctx.strokeStyle = '#2a2a3a'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + chartW, y); ctx.stroke();
      if (v > 0) {
        ctx.fillStyle = '#6a6a88';
        ctx.font = `9px DM Mono, monospace`;
        ctx.textAlign = 'right';
        ctx.fillText(Math.round(maxVal * v), padL - 4, y + 3);
      }
    });

    // Bars
    monthlyData.forEach((val, i) => {
      if (val === 0) {
        // Month label only
        ctx.fillStyle = '#3a3a4a';
        ctx.font = '9px DM Mono, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(MONTHS[i].slice(0,1), padL + i * barW + barW/2, H - 10);
        return;
      }
      const barH = (val / maxVal) * chartH;
      const x = padL + i * barW + barW * 0.15;
      const w = barW * 0.7;
      const y = padT + chartH - barH;

      // Bar color: current month = accent, past = muted, future = border
      const isCurrentMonth = i === currentMonth;
      const isPast = i < currentMonth;
      
      if (isCurrentMonth) {
        const grad = ctx.createLinearGradient(0, y, 0, y + barH);
        grad.addColorStop(0, '#f0d060');
        grad.addColorStop(1, '#c8a030');
        ctx.fillStyle = grad;
      } else if (isPast) {
        ctx.fillStyle = '#3a4a5a';
      } else {
        ctx.fillStyle = '#2a2a3a';
      }

      ctx.beginPath();
      ctx.roundRect(x, y, w, barH, [3, 3, 0, 0]);
      ctx.fill();

      // Value label on top
      if (val > 0) {
        ctx.fillStyle = isCurrentMonth ? '#e8c84a' : '#6a6a88';
        ctx.font = `bold 8px DM Mono, monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(val, x + w/2, y - 3);
      }

      // Month label
      ctx.fillStyle = isCurrentMonth ? '#e8c84a' : '#6a6a88';
      ctx.font = '9px DM Mono, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(MONTHS[i].slice(0,1), x + w/2, H - 10);
    });

  }, [sessions, year]);

  const total = monthlyData.reduce((a,v) => a+v, 0);

  return (
    <div className="card" style={{marginBottom:12}}>
      <div className="card-header">
        <span className="card-title">Shells fired {year}</span>
        <span style={{fontFamily:'DM Mono,monospace',fontSize:12,color:'var(--accent)'}}>{total.toLocaleString()} shells</span>
      </div>
      {total === 0 ? (
        <div className="empty" style={{padding:'20px 0'}}>
          <div className="empty-text">No shell data for {year}.</div>
        </div>
      ) : (
        <canvas ref={canvasRef} style={{width:'100%',height:'140px',display:'block'}} />
      )}
    </div>
  );
}

function Dashboard({ sessions, onSessionClick }) {
  const year = new Date().getFullYear();
  const yearSessions = sessions.filter(s => (s.date||'').startsWith(year));
  const totalShots = yearSessions.reduce((a,s) => a + (s.munition||0), 0);

  const compYear  = sessions.filter(s => s.type==='wettkampf' && s.max>0 && (s.date||'').startsWith(year));
  const compAll   = sessions.filter(s => s.type==='wettkampf' && s.max>0);
  const quoteYear = compYear.length  ? Math.round(compYear.reduce((a,s)=>a+s.score/s.max,0)/compYear.length*1000)/10 : null;
  const quoteAll  = compAll.length   ? Math.round(compAll.reduce((a,s)=>a+s.score/s.max,0)/compAll.length*1000)/10  : null;

  const recent = [...sessions].sort((a,b) => b.date > a.date ? 1 : -1).slice(0, 5);

  return (
    <div>
      <div className="stat-grid">
        <div className="stat-box">
          <div className="stat-val">{yearSessions.length}</div>
          <div className="stat-label">Sessions {year}</div>
        </div>
        <div className="stat-box">
          <div className="stat-val">{quoteYear !== null ? quoteYear+'%' : '–'}</div>
          <div className="stat-label">🏆 Ø {year}</div>
        </div>
        <div className="stat-box">
          <div className="stat-val">{compYear.length}</div>
          <div className="stat-label">🏆 Competitions</div>
        </div>
        <div className="stat-box">
          <div className="stat-val">{quoteAll !== null ? quoteAll+'%' : '–'}</div>
          <div className="stat-label">Ø All time</div>
        </div>
      </div>
      <MunitionsChart sessions={sessions} year={year} />
      <div className="card">
        <div className="card-header">
          <span className="card-title">Recent</span>
        </div>
        {recent.length === 0 ? (
          <div className="empty">
            <div className="empty-icon">🎯</div>
            <div className="empty-text">No entries yet.<br/>Tap + to get started.</div>
          </div>
        ) : (
          recent.map(s => <SessionItem key={s.id} s={s} compact onClick={() => onSessionClick(s)} />)
        )}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   SESSIONS PAGE
════════════════════════════════════════════════════════════════ */
function SessionsPage({ sessions, onSessionClick }) {
  const [filter, setFilter] = useState({ type: '', disziplin: '', waffe: '', ort: '', munition: '' });
  const [showFilter, setShowFilter] = useState(false);

  const disziplinen = [...new Set(sessions.map(s => s.disziplin).filter(Boolean))].sort();
  const waffen = [...new Set(sessions.map(s => s.waffe).filter(Boolean))].sort();
  const orte = [...new Set(sessions.map(s => s.ort).filter(Boolean))].sort();
  const munitions = [...new Set(sessions.map(s => s.munition_typ).filter(Boolean))].sort();

  const hasFilter = filter.type || filter.disziplin || filter.waffe || filter.ort || filter.munition;

  const filtered = sessions
    .filter(s => !filter.type || s.type === filter.type)
    .filter(s => !filter.disziplin || s.disziplin === filter.disziplin)
    .filter(s => !filter.waffe || s.waffe === filter.waffe)
    .filter(s => !filter.ort || s.ort === filter.ort)
    .filter(s => !filter.munition || s.munition_typ === filter.munition)
    .sort((a,b) => b.date > a.date ? 1 : -1);

  // Group by month
  const grouped = {};
  filtered.forEach(s => {
    const d = new Date(s.date);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    const label = d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    if (!grouped[key]) grouped[key] = { label, sessions: [] };
    grouped[key].sessions.push(s);
  });
  const groupKeys = Object.keys(grouped).sort((a,b) => b.localeCompare(a));

  return (
    <div>
      <div style={{display:'flex',gap:8,marginBottom:12,alignItems:'center'}}>
        <button className={`analyse-tab ${showFilter?'active':''}`} onClick={()=>setShowFilter(f=>!f)} style={{flexShrink:0}}>
          🔽 Filter{hasFilter ? ' ●' : ''}
        </button>
        {hasFilter && (
          <button className="analyse-tab" onClick={()=>setFilter({type:'',disziplin:'',waffe:'',ort:'',munition:''})}>✕ Reset</button>
        )}
        <span style={{fontSize:11,color:'var(--muted)',fontFamily:'DM Mono,monospace',marginLeft:'auto'}}>{filtered.length} sessions</span>
      </div>

      {showFilter && (
        <div className="card" style={{marginBottom:12,padding:'12px 14px'}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            <div>
              <label>Type</label>
              <select value={filter.type} onChange={e=>setFilter(f=>({...f,type:e.target.value}))}>
                <option value="">All</option>
                <option value="training">Practice</option>
                <option value="wettkampf">Competition</option>
              </select>
            </div>
            <div>
              <label>Discipline</label>
              <select value={filter.disziplin} onChange={e=>setFilter(f=>({...f,disziplin:e.target.value}))}>
                <option value="">All</option>
                {disziplinen.map(d => <option key={d}>{d}</option>)}
              </select>
            </div>
            <div>
              <label>Gun</label>
              <select value={filter.waffe} onChange={e=>setFilter(f=>({...f,waffe:e.target.value}))}>
                <option value="">All</option>
                {waffen.map(w => <option key={w}>{w}</option>)}
              </select>
            </div>
            <div>
              <label>Location</label>
              <select value={filter.ort} onChange={e=>setFilter(f=>({...f,ort:e.target.value}))}>
                <option value="">All</option>
                {orte.map(o => <option key={o}>{o}</option>)}
              </select>
            </div>
            <div style={{gridColumn:'1/-1'}}>
              <label>Ammo</label>
              <select value={filter.munition} onChange={e=>setFilter(f=>({...f,munition:e.target.value}))}>
                <option value="">All</option>
                {munitions.map(m => <option key={m}>{m}</option>)}
              </select>
            </div>
          </div>
        </div>
      )}

      {filtered.length === 0 ? (
        <div className="empty">
          <div className="empty-icon">📋</div>
          <div className="empty-text">No sessions found.</div>
        </div>
      ) : groupKeys.map(key => (
        <div key={key} style={{marginBottom:16}}>
          <div style={{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:'var(--muted)',fontFamily:'DM Mono,monospace',marginBottom:8,paddingLeft:2}}>
            {grouped[key].label} <span style={{color:'var(--border)'}}>·</span> <span style={{color:'var(--accent)'}}>{grouped[key].sessions.length}</span>
          </div>
          <div className="card" style={{padding:'0 16px'}}>
            {grouped[key].sessions.map(s => <SessionItem key={s.id} s={s} onClick={() => onSessionClick(s)} />)}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════

function NotizenPage({ sessions, noteStates, onToggleNote }) {
  const [filter, setFilter] = useState('alle');
  const withNotes = sessions.filter(s => s.notes && s.notes.trim());

  const filtered = withNotes.filter(s => {
    const st = noteStates[s.id] || 'normal';
    if (filter === 'aufgaben') return st === 'aufgabe';
    if (filter === 'erledigt') return st === 'erledigt';
    return true;
  }).sort((a,b) => b.date > a.date ? 1 : -1);

  const filterLabels = { alle: 'All', aufgaben: 'Tasks', erledigt: 'Done' };

  return (
    <div>
      <div className="tab-row">
        {['alle','aufgaben','erledigt'].map(f => (
          <button key={f} className={`analyse-tab ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>
            {filterLabels[f]}
          </button>
        ))}
      </div>
      {filtered.length === 0 ? (
        <div className="empty">
          <div className="empty-icon">📝</div>
          <div className="empty-text">No notes found.</div>
        </div>
      ) : filtered.map(s => {
        const st = noteStates[s.id] || 'normal';
        return (
          <div key={s.id} className={`notiz-card ${st==='erledigt'?'erledigt':''}`}>
            <div className="notiz-meta">{fmtDate(s.date)} · {s.disziplin}</div>

              <span className={`notiz-tag erledigt-tag ${st==='erledigt'?'active':''}`}
                onClick={()=>onToggleNote(s.id, st==='erledigt'?'normal':'erledigt')}>
                ✅ Done
              </span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   ANALYSE PAGE
════════════════════════════════════════════════════════════════ */
function ResultateChart({ sessions }) {
  const canvasRef = useRef(null);
  const [typeFilter, setTypeFilter] = useState('wettkampf'); // beide | wettkampf | training
  const [disziplin, setDisziplin] = useState('alle');

  const disziplinen = [...new Set(sessions.filter(s=>s.max>0).map(s=>s.disziplin).filter(Boolean))].sort();

  // Filter sessions
  const base = sessions.filter(s => s.max > 0)
    .filter(s => disziplin === 'alle' || s.disziplin === disziplin)
    .sort((a,b) => a.date > b.date ? 1 : -1);

  const wettkampf = base.filter(s => s.type === 'wettkampf');
  const training  = base.filter(s => s.type === 'training');

  // Stats
  const currentYear = String(new Date().getFullYear());
  function avgQuote(arr) {
    const v = arr.filter(s=>s.max>0);
    return v.length ? Math.round(v.reduce((a,s)=>a+s.score/s.max*100,0)/v.length*10)/10 : null;
  }
  const showComp = typeFilter !== 'training';
  const showTrain = typeFilter !== 'wettkampf';

  const compYear  = avgQuote(wettkampf.filter(s=>s.date?.startsWith(currentYear)));
  const compTotal = avgQuote(wettkampf);
  const trainYear  = avgQuote(training.filter(s=>s.date?.startsWith(currentYear)));
  const trainTotal = avgQuote(training);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth;
    const H = 240;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    const padL = 36, padR = 12, padT = 20, padB = 32;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;

    // Collect all data points sorted by date
    const lines = [];
    if (showComp && wettkampf.length > 0) lines.push({ data: wettkampf, color: '#4ae8c8', fill: 'rgba(74,232,200,0.12)' });
    if (showTrain && training.length > 0)  lines.push({ data: training,  color: '#e8c84a', fill: 'rgba(232,200,74,0.10)' });

    if (!lines.length || !lines.some(l=>l.data.length>0)) return;

    // Determine x range (all dates)
    const allDates = lines.flatMap(l => l.data.map(s => s.date)).sort();
    const minDate = new Date(allDates[0]);
    const maxDate = new Date(allDates[allDates.length-1]);
    const dateRange = Math.max(maxDate - minDate, 1);

    // Y range
    const allVals = lines.flatMap(l => l.data.map(s => Math.round(s.score/s.max*100)));
    const minY = Math.max(0, Math.min(...allVals) - 10);
    const maxY = Math.min(100, Math.max(...allVals) + 5);
    const yRange = maxY - minY || 1;

    function toX(dateStr) {
      return padL + ((new Date(dateStr) - minDate) / dateRange) * chartW;
    }
    function toY(pct) {
      return padT + chartH - ((pct - minY) / yRange) * chartH;
    }

    // Grid
    const gridVals = [];
    for (let v = Math.ceil(minY/25)*25; v <= maxY; v += 25) gridVals.push(v);
    gridVals.forEach(v => {
      const y = toY(v);
      ctx.strokeStyle = '#2a2a3a'; ctx.lineWidth = 1; ctx.setLineDash([3,4]);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL+chartW, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#6a6a88'; ctx.font = '9px DM Mono,monospace'; ctx.textAlign = 'right';
      ctx.fillText(v+'%', padL-4, y+3);
    });

    // Year separators
    const years = [...new Set(lines.flatMap(l=>l.data.map(s=>s.date.slice(0,4))))].sort();
    years.forEach(yr => {
      const x = toX(yr+'-01-01');
      if (x > padL+10 && x < padL+chartW-10) {
        ctx.strokeStyle = '#3a3a5a'; ctx.lineWidth = 1; ctx.setLineDash([2,4]);
        ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,padT+chartH); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#4a4a6a'; ctx.font = '9px DM Mono,monospace'; ctx.textAlign = 'center';
        ctx.fillText(yr, x, padT-4);
      }
    });

    // X axis month labels (sample a few)
    const monthDates = [];
    let d = new Date(minDate); d.setDate(1);
    while (d <= maxDate) { monthDates.push(new Date(d)); d.setMonth(d.getMonth()+3); }
    monthDates.forEach(md => {
      const x = toX(md.toISOString().slice(0,10));
      ctx.fillStyle = '#6a6a88'; ctx.font = '9px DM Mono,monospace'; ctx.textAlign = 'center';
      const lbl = md.toLocaleDateString('en-GB',{month:'short'});
      ctx.fillText(lbl, x, H-8);
    });

    // Draw each line
    lines.forEach(({ data, color, fill }) => {
      if (data.length === 0) return;
      const pts = data.map(s => ({ x: toX(s.date), y: toY(Math.round(s.score/s.max*100)), pct: Math.round(s.score/s.max*100) }));

      // Fill area
      ctx.beginPath();
      ctx.moveTo(pts[0].x, padT+chartH);
      pts.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(pts[pts.length-1].x, padT+chartH);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();

      // Line
      ctx.beginPath();
      ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
      pts.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
      ctx.stroke();

      // Dots + labels
      pts.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
        ctx.fillStyle = '#13131a'; ctx.fill();
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = color; ctx.font = 'bold 9px DM Mono,monospace'; ctx.textAlign = 'center';
        ctx.fillText(p.pct+'%', p.x, p.y - 8);
      });
    });

  }, [sessions, typeFilter, disziplin]);

  return (
    <div className="card">
      <div className="card-title" style={{marginBottom:12}}>Score</div>

      {/* Type filter */}
      <div style={{display:'flex',gap:6,marginBottom:12}}>
        {[['wettkampf','🏆 Competition'],['training','🏋️ Practice'],['beide','Both']].map(([v,l]) => (
          <button key={v} className={`analyse-tab ${typeFilter===v?'active':''}`} onClick={()=>setTypeFilter(v)}>{l}</button>
        ))}
      </div>

      <select value={disziplin} onChange={e=>setDisziplin(e.target.value)} style={{marginBottom:12}}>
        <option value="alle">All disciplines</option>
        {disziplinen.map(d=><option key={d}>{d}</option>)}
      </select>

      {showComp && compTotal !== null && (
        <div style={{fontFamily:'DM Mono,monospace',fontSize:12,color:'var(--accent2)',marginBottom:6}}>
          🏆 Ø {currentYear}: {compYear !== null ? compYear+'%' : '–'} | Ø All: {compTotal}%
        </div>
      )}
      {showTrain && trainTotal !== null && (
        <div style={{fontFamily:'DM Mono,monospace',fontSize:12,color:'var(--accent)',marginBottom:6}}>
          🏋️ Ø {currentYear}: {trainYear !== null ? trainYear+'%' : '–'} | Ø All: {trainTotal}%
        </div>
      )}

      {base.length === 0 ? (
        <div className="empty" style={{padding:'20px 0'}}>
          <div className="empty-text">No results yet.</div>
        </div>
      ) : (
        <>
          <canvas ref={canvasRef} style={{width:'100%',height:'240px',display:'block',marginTop:8}} />
          <div style={{display:'flex',gap:16,marginTop:10,flexWrap:'wrap'}}>
            {showComp && wettkampf.length>0 && <div style={{display:'flex',alignItems:'center',gap:6,fontSize:12,fontFamily:'DM Mono,monospace'}}><div style={{width:20,height:3,background:'#4ae8c8',borderRadius:2}}/><span style={{color:'#4ae8c8'}}>Competition</span></div>}
            {showTrain && training.length>0  && <div style={{display:'flex',alignItems:'center',gap:6,fontSize:12,fontFamily:'DM Mono,monospace'}}><div style={{width:20,height:3,background:'#e8c84a',borderRadius:2}}/><span style={{color:'#e8c84a'}}>Practice</span></div>}
          </div>
        </>
      )}
    </div>
  );
}

function JahresvergleichChart({ sessions }) {
  const canvasRef = useRef(null);
  const YEAR_COLORS = ['#4ae8c8','#e8c84a','#e84a4a','#c84ae8','#4a8ce8','#e88c4a'];

  const allYears = [...new Set(sessions.filter(s=>s.max>0).map(s=>s.date?.slice(0,4)).filter(Boolean))].sort();
  const allDisziplinen = [...new Set(sessions.filter(s=>s.max>0).map(s=>s.disziplin).filter(Boolean))].sort();

  const [activeYears, setActiveYears] = useState(allYears);
  const [disziplin, setDisziplin] = useState('alle');

  // Sync activeYears when new sessions load
  useEffect(() => { setActiveYears(allYears); }, [sessions.length]);

  function toggleYear(y) {
    setActiveYears(prev => prev.includes(y) ? prev.filter(x=>x!==y) : [...prev, y]);
  }

  function getMonthlyAvg(year) {
    const src = sessions.filter(s =>
      s.date?.startsWith(year) && s.max > 0 &&
      (disziplin === 'alle' || s.disziplin === disziplin)
    );
    const monthly = {};
    src.forEach(s => {
      const m = parseInt(s.date.slice(5,7)) - 1;
      if (!monthly[m]) monthly[m] = { total: 0, count: 0 };
      monthly[m].total += s.score/s.max*100;
      monthly[m].count++;
    });
    const avg = src.length ? Math.round(src.reduce((a,s)=>a+s.score/s.max*100,0)/src.length*10)/10 : null;
    return { monthly, avg };
  }

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || !allYears.length) return;
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth;
    const H = 220;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0,0,W,H);

    const padL=36, padR=10, padT=14, padB=28;
    const chartW=W-padL-padR, chartH=H-padT-padB;
    const MONTH_LABELS=['J','F','M','A','M','J','J','A','S','O','N','D'];

    // Grid
    [0,25,50,75,100].forEach(v => {
      const y = padT + chartH - (v/100)*chartH;
      ctx.strokeStyle='#2a2a3a'; ctx.lineWidth=1; ctx.setLineDash([3,4]);
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+chartW,y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#6a6a88'; ctx.font='9px DM Mono,monospace'; ctx.textAlign='right';
      ctx.fillText(v+'%', padL-4, y+3);
    });

    // Month labels
    for (let i=0;i<12;i++) {
      const x = padL + (i/11)*chartW;
      ctx.fillStyle='#6a6a88'; ctx.font='9px DM Mono,monospace'; ctx.textAlign='center';
      ctx.fillText(MONTH_LABELS[i], x, H-8);
    }

    // Draw one line per active year
    allYears.forEach((year, yi) => {
      if (!activeYears.includes(year)) return;
      const { monthly } = getMonthlyAvg(year);
      const color = YEAR_COLORS[yi % YEAR_COLORS.length];
      const pts = [];
      for (let i=0;i<12;i++) {
        if (monthly[i]) {
          pts.push({ x: padL+(i/11)*chartW, y: padT+chartH-(monthly[i].total/monthly[i].count/100)*chartH, val: Math.round(monthly[i].total/monthly[i].count) });
        }
      }
      if (pts.length === 0) return;

      ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.beginPath();
      pts.forEach((p,idx) => idx===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
      ctx.stroke();

      pts.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2);
        ctx.fillStyle='#13131a'; ctx.fill();
        ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle=color; ctx.font='bold 9px DM Mono,monospace'; ctx.textAlign='center';
        ctx.fillText(p.val+'%', p.x, p.y-9);
      });
    });

  }, [sessions, activeYears, disziplin]);

  return (
    <div>
      {/* Filters */}
      <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
        {/* Year toggles */}
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {allYears.map((y,i) => (
            <button key={y}
              className="analyse-tab"
              style={{
                background: activeYears.includes(y) ? 'rgba(255,255,255,0.05)' : 'transparent',
                borderColor: activeYears.includes(y) ? YEAR_COLORS[i%YEAR_COLORS.length] : 'var(--border)',
                color: activeYears.includes(y) ? YEAR_COLORS[i%YEAR_COLORS.length] : 'var(--muted)'
              }}
              onClick={()=>toggleYear(y)}>
              {y}
            </button>
          ))}
        </div>
        {/* Disziplin filter */}
        <select value={disziplin} onChange={e=>setDisziplin(e.target.value)} style={{flex:1,minWidth:120}}>
          <option value="alle">All disciplines</option>
          {allDisziplinen.map(d=><option key={d}>{d}</option>)}
        </select>
      </div>

      <div className="card">
        <div className="card-title" style={{marginBottom:12}}>Year comparison</div>
        {allYears.length === 0 ? (
          <div className="empty"><div className="empty-text">No results yet.</div></div>
        ) : (
          <>
            <canvas ref={canvasRef} style={{width:'100%',height:'220px',display:'block'}} />
            <div style={{display:'flex',flexWrap:'wrap',gap:10,marginTop:12}}>
              {allYears.filter(y=>activeYears.includes(y)).map((y,i) => {
                const { avg } = getMonthlyAvg(y);
                const colorIdx = allYears.indexOf(y);
                return avg !== null ? (
                  <div key={y} style={{display:'flex',alignItems:'center',gap:6,fontSize:12,fontFamily:'DM Mono,monospace'}}>
                    <div style={{width:16,height:3,background:YEAR_COLORS[colorIdx%YEAR_COLORS.length],borderRadius:2}}/>
                    <span style={{color:YEAR_COLORS[colorIdx%YEAR_COLORS.length]}}>{y}</span>
                    <span style={{color:'var(--muted)'}}>Ø {avg}%</span>
                  </div>
                ) : null;
              })}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function AnalysePage({ sessions }) {
  const [tab, setTab] = useState('resultate');
  const currentYear = new Date().getFullYear();
  const years = [...new Set(sessions.map(s => s.date?.slice(0,4)).filter(Boolean))].sort((a,b)=>b-a);
  const [selectedYear, setSelectedYear] = useState(String(currentYear));
  const [compareYears, setCompareYears] = useState([]);

  const filtered = selectedYear === 'alle' ? sessions : sessions.filter(s => (s.date||'').startsWith(selectedYear));

  const waffenMap = {};
  filtered.forEach(s => {
    if (!s.waffe) return;
    if (!waffenMap[s.waffe]) waffenMap[s.waffe] = { sessions: 0, scored: 0, totalQ: 0 };
    waffenMap[s.waffe].sessions++;
    if (s.max > 0) { waffenMap[s.waffe].scored++; waffenMap[s.waffe].totalQ += s.score/s.max; }
  });
  const waffenRows = Object.entries(waffenMap).sort((a,b) => b[1].sessions - a[1].sessions);

  const munMap = {};
  filtered.forEach(s => {
    if (!s.munition_typ) return;
    if (!munMap[s.munition_typ]) munMap[s.munition_typ] = { sessions: 0, shots: 0 };
    munMap[s.munition_typ].sessions++;
    munMap[s.munition_typ].shots += s.munition || 0;
  });
  const munRows = Object.entries(munMap).sort((a,b) => b[1].sessions - a[1].sessions);

  const YEAR_COLORS = ['#e8c84a','#4ae8c8','#e84a4a','#c84ae8','#4a8ce8'];
  function getMonthlyData(year) {
    const monthly = {};
    sessions.filter(s => s.date?.startsWith(year) && s.max > 0).forEach(s => {
      const m = s.date.slice(5,7);
      if (!monthly[m]) monthly[m] = { total: 0, count: 0 };
      monthly[m].total += s.score/s.max*100;
      monthly[m].count++;
    });
    return monthly;
  }

  const toggleCompareYear = (y) => {
    setCompareYears(prev => prev.includes(y) ? prev.filter(x=>x!==y) : [...prev, y]);
  };

  const canvasRef = useRef(null);
  useEffect(() => {
    if (tab !== 'jahresvergleich') return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth;
    const H = 200;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0,0,W,H);

    const activeYears = [selectedYear, ...compareYears].filter(y => y !== 'alle');
    if (!activeYears.length) return;

    const months = ['01','02','03','04','05','06','07','08','09','10','11','12'];
    const monthLabels = ['J','F','M','A','M','J','J','A','S','O','N','D'];
    const padL=32, padR=10, padT=10, padB=24;
    const chartW=W-padL-padR, chartH=H-padT-padB;

    [0,25,50,75,100].forEach(v => {
      const y = padT + chartH - (v/100)*chartH;
      ctx.strokeStyle='#2a2a3a'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+chartW,y); ctx.stroke();
      ctx.fillStyle='#6a6a88'; ctx.font='9px DM Mono,monospace'; ctx.textAlign='right';
      ctx.fillText(v+'%', padL-4, y+3);
    });

    months.forEach((m,i) => {
      const x = padL + (i/(months.length-1))*chartW;
      ctx.fillStyle='#6a6a88'; ctx.font='9px DM Mono,monospace'; ctx.textAlign='center';
      ctx.fillText(monthLabels[i], x, H-6);
    });

    activeYears.forEach((year, yi) => {
      const data = getMonthlyData(year);
      const color = YEAR_COLORS[yi % YEAR_COLORS.length];
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
      let started = false;
      months.forEach((m, i) => {
        if (!data[m]) return;
        const x = padL + (i/(months.length-1))*chartW;
        const y = padT + chartH - (data[m].total/data[m].count/100)*chartH;
        if (!started) { ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
      });
      ctx.stroke();
      months.forEach((m, i) => {
        if (!data[m]) return;
        const x = padL + (i/(months.length-1))*chartW;
        const y = padT + chartH - (data[m].total/data[m].count/100)*chartH;
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
      });
    });
  }, [tab, selectedYear, compareYears, sessions]);

  return (
    <div>
      <div className="tab-row">
        {[['resultate','📈 Score'],['jahresvergleich','📅 Years'],['munition','🔴 Ammo'],['waffen','🔫 Guns']].map(([t,l]) => (
          <button key={t} className={`analyse-tab ${tab===t?'active':''}`} onClick={()=>setTab(t)}>{l}</button>
        ))}
      </div>

      {(tab === 'munition' || tab === 'waffen') && (
        <div className="tab-row" style={{marginBottom:14}}>
          {['alle', ...years].map(y => (
            <button key={y} className={`analyse-tab ${selectedYear===y?'active':''}`} onClick={()=>setSelectedYear(y)}>{y==='alle'?'All':y}</button>
          ))}
        </div>
      )}

      {tab === 'resultate' && <ResultateChart sessions={sessions} />}

      {tab === 'munition' && (
        <div className="card">
          {munRows.length === 0 ? (
            <div className="empty"><div className="empty-icon">🔴</div><div className="empty-text">No ammo data.</div></div>
          ) : (
            <table className="a-table">
              <thead><tr><th>Ammo</th><th className="num">Sessions</th><th className="num">Shells</th></tr></thead>
              <tbody>
                {munRows.map(([m,d]) => (
                  <tr key={m}><td>{m}</td><td className="num">{d.sessions}</td><td className="num">{d.shots.toLocaleString()}</td></tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {tab === 'waffen' && (
        <div className="card">
          {waffenRows.length === 0 ? (
            <div className="empty"><div className="empty-icon">🔫</div><div className="empty-text">No gun data.</div></div>
          ) : (
            <table className="a-table">
              <thead><tr><th>Gun</th><th className="num">Sessions</th><th className="num">Ø Score</th></tr></thead>
              <tbody>
                {waffenRows.map(([w,d]) => (
                  <tr key={w}><td>{w}</td><td className="num">{d.sessions}</td><td className="num" style={{color:'var(--accent)'}}>{d.scored ? Math.round(d.totalQ/d.scored*100)+'%' : '–'}</td></tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {tab === 'jahresvergleich' && (
        <JahresvergleichChart sessions={sessions} />
      )}
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   SESSION MODAL (Neue Einheit / Bearbeiten)
════════════════════════════════════════════════════════════════ */
const DEFAULT_DISZIPLINEN = ['Fitasc','Compak','Skeet','Universal','Trap'];
const DISZ_CONFIG = {
  Fitasc: { passen: 4, maxPro: 25, scoreOnly: false },
  Compak: { passen: 4, maxPro: 25, scoreOnly: false },
  Skeet:  { passen: 4, maxPro: 25, scoreOnly: false },
  Universal: { passen: 6, maxPro: 25, scoreOnly: false },
  Trap:   { passen: 5, maxPro: 25, scoreOnly: false },
};

function SessionModal({ session, lists, customDisz, onSave, onDelete, onClose }) {
  const isEdit = !!session?.id;
  const allDisz = [...DEFAULT_DISZIPLINEN, ...customDisz.map(d=>d.name)];

  const [type, setType] = useState(session?.type || 'training');
  const [disziplin, setDisziplin] = useState(session?.disziplin || 'Fitasc');
  const [date, setDate] = useState(session?.date || todayStr());
  const [notes, setNotes] = useState(session?.notes || '');
  const [munition, setMunition] = useState(session?.munition || '');
  const [ort, setOrt] = useState(session?.ort || '');
  const [waffe, setWaffe] = useState(session?.waffe || '');
  const [munitionTyp, setMunitionTyp] = useState(session?.munition_typ || '');

  // Score state
  const [hasScore, setHasScore] = useState(session?.max > 0 || false);
  const [passen, setPassen] = useState(() => {
    if (session?.passen?.length) return session.passen.length;
    const cfg = DISZ_CONFIG[session?.disziplin] || DISZ_CONFIG['Fitasc'];
    return cfg.passen;
  });
  const [passenVals, setPassenVals] = useState(() => {
    if (session?.passen?.length) return session.passen;
    const cfg = DISZ_CONFIG[session?.disziplin] || DISZ_CONFIG['Fitasc'];
    return Array(cfg.passen).fill('');
  });
  const [maxPro, setMaxPro] = useState(() => {
    if (session?.id && session?.max) {
      const cfg = DISZ_CONFIG[session.disziplin];
      if (cfg) return cfg.maxPro;
      const cd = customDisz.find(d=>d.name===session.disziplin);
      return cd ? cd.maxPro : 25;
    }
    return DISZ_CONFIG[disziplin]?.maxPro || 25;
  });

  // scoreOnly state for custom disciplines with no passen
  const [scoreOnlyVal, setScoreOnlyVal] = useState(() => session?.score || '');
  const [scoreOnlyMax, setScoreOnlyMax] = useState(() => {
    if (session?.max) return session.max;
    const cd = customDisz.find(d=>d.name===session?.disziplin);
    return cd?.scoreOnly ? (cd.totalMax || '') : '';
  });

  // Check if current disziplin is scoreOnly
  const getCfg = (d) => DISZ_CONFIG[d] || customDisz.find(x=>x.name===d);
  const isScoreOnly = getCfg(disziplin)?.scoreOnly === true;

  // When disziplin changes, update passen config
  useEffect(() => {
    const cfg = getCfg(disziplin);
    if (!cfg) return;
    if (cfg.scoreOnly) {
      setScoreOnlyMax(cfg.totalMax || '');
      setScoreOnlyVal('');
    } else if (type === 'wettkampf' || hasScore) {
      const p = cfg.passen || 4;
      const mp = cfg.maxPro || 25;
      setPassen(p);
      setPassenVals(Array(p).fill(''));
      setMaxPro(mp);
    }
  }, [disziplin, type]);

  const totalScore = passenVals.reduce((a,v) => a + (parseInt(v)||0), 0);
  const totalMax = passen * maxPro;

  function handlePassen(delta) {
    setPassen(p => {
      const np = Math.max(1, Math.min(20, p + delta));
      setPassenVals(v => {
        const nv = [...v];
        while (nv.length < np) nv.push('');
        return nv.slice(0, np);
      });
      return np;
    });
  }

  function handleSave() {
    let score, max, passenArr;
    if (isScoreOnly) {
      score = parseInt(scoreOnlyVal)||0;
      max   = parseInt(scoreOnlyMax)||0;
      passenArr = [];
    } else {
      score = (type==='wettkampf' || hasScore) ? totalScore : null;
      max   = (type==='wettkampf' || hasScore) ? totalMax   : null;
      passenArr = (type==='wettkampf' || hasScore) ? passenVals.map(v=>parseInt(v)||0) : [];
    }
    const s = {
      id: session?.id || crypto.randomUUID(),
      type, disziplin, date, notes,
      munition: parseInt(munition)||0,
      ort, waffe, munition_typ: munitionTyp,
      score, max, passen: passenArr,
    };
    onSave(s);
  }

  return (
    <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-handle" />
        <div className="modal-title">{isEdit ? 'Edit' : 'New Entry'}</div>

        {/* Type */}
        <div className="form-group">
          <label>Type</label>
          <div className="type-btn-row">
            <button className="type-btn" style={{background: type==='training'?'var(--accent)':'var(--card)', color: type==='training'?'#000':'var(--muted)', border:'1px solid var(--border)'}} onClick={()=>setType('training')}>🏋️ Practice</button>
            <button className="type-btn" style={{background: type==='wettkampf'?'var(--accent2)':'var(--card)', color: type==='wettkampf'?'#000':'var(--muted)', border:'1px solid var(--border)'}} onClick={()=>setType('wettkampf')}>🏆 Competition</button>
          </div>
        </div>

        {/* Discipline + Date */}
        <div className="input-row">
          <div className="form-group">
            <label>Discipline</label>
            <select value={disziplin} onChange={e=>setDisziplin(e.target.value)}>
              {allDisz.map(d => <option key={d}>{d}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label>Date</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} />
          </div>
        </div>

        <div className="divider"><div className="divider-line"/><div className="divider-text">RESULT</div><div className="divider-line"/></div>

        {/* Score section */}
        {isScoreOnly ? (
          <ScoreOnlyInput
            scoreVal={scoreOnlyVal} maxVal={scoreOnlyMax}
            onChangeScore={setScoreOnlyVal} onChangeMax={setScoreOnlyMax} />
        ) : type === 'wettkampf' ? (
          <WettkampfScore passen={passen} passenVals={passenVals} maxPro={maxPro}
            totalScore={totalScore} totalMax={totalMax}
            onChangePassen={handlePassen}
            onChangeVal={(i,v) => { const nv=[...passenVals]; nv[i]=v; setPassenVals(nv); }} />
        ) : (
          <TrainingScore hasScore={hasScore} onToggle={()=>setHasScore(h=>!h)}
            passen={passen} passenVals={passenVals} maxPro={maxPro}
            totalScore={totalScore} totalMax={totalMax}
            onChangePassen={handlePassen}
            onChangeVal={(i,v) => { const nv=[...passenVals]; nv[i]=v; setPassenVals(nv); }} />
        )}

        {/* Notes */}
        <div className="form-group" style={{marginTop:8}}>
          <label>Notes</label>
          <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="How did it go? What worked, what didn't?" />
        </div>

        {/* Shells + Location */}
        <div className="input-row">
          <div className="form-group">
            <label>Shells</label>
            <input type="number" value={munition} onChange={e=>setMunition(e.target.value)} placeholder="25" min="0" />
          </div>
          <div className="form-group">
            <label>Location</label>
            <div className="select-row">
              <select value={ort} onChange={e=>setOrt(e.target.value)}>
                <option value="">– Location –</option>
                {(lists.ort||[]).map(o=><option key={o}>{o}</option>)}
              </select>
            </div>
          </div>
        </div>

        {/* Ammo + Gun */}
        <div className="input-row">
          <div className="form-group">
            <label>Ammo</label>
            <select value={munitionTyp} onChange={e=>setMunitionTyp(e.target.value)}>
              <option value="">– Ammo –</option>
              {(lists.munition||[]).map(m=><option key={m}>{m}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label>Gun</label>
            <select value={waffe} onChange={e=>setWaffe(e.target.value)}>
              <option value="">– Gun –</option>
              {(lists.waffe||[]).map(w=><option key={w}>{w}</option>)}
            </select>
          </div>
        </div>

        <button className="btn btn-primary" onClick={handleSave}>Save</button>
        {isEdit && <button className="btn btn-danger" style={{marginTop:8}} onClick={()=>onDelete(session.id)}>🗑 Delete</button>}
        <button className="btn btn-ghost" style={{marginTop:8}} onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════
   RESET PASSWORD SCREEN
════════════════════════════════════════════════════════════════ */
function ResetPasswordScreen({ accessToken, onDone }) {
  const [password, setPassword] = React.useState('');
  const [password2, setPassword2] = React.useState('');
  const [error, setError] = React.useState('');
  const [success, setSuccess] = React.useState('');
  const [loading, setLoading] = React.useState(false);

  async function handleReset() {
    if (!password || password.length < 6) { setError('Password must be at least 6 characters.'); return; }
    if (password !== password2) { setError('Passwords do not match.'); return; }
    setLoading(true); setError(''); setSuccess('');
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${accessToken}` },
        body: JSON.stringify({ password })
      });
      if (!res.ok) { const d = await res.json(); throw new Error(d.message || d.error_description || 'Error'); }
      setSuccess('✅ Password updated! You can now sign in.');
      window.history.replaceState(null, '', window.location.pathname);
      setTimeout(() => onDone(), 2500);
    } catch(e) {
      setError(e.message);
    } finally { setLoading(false); }
  }

  return (
    <div className="auth-screen">
      <div style={{marginBottom:'8px',textAlign:'center'}}>
        <div className="auth-logo">ClayLog</div>
      </div>
      <div className="auth-box">
        <div className="auth-title">Set new password</div>
        <div className="form-group">
          <label>New password</label>
          <input type="password" placeholder="Min. 6 characters" value={password}
            onChange={e=>setPassword(e.target.value)} />
        </div>
        <div className="form-group">
          <label>Repeat password</label>
          <input type="password" placeholder="Repeat password" value={password2}
            onChange={e=>setPassword2(e.target.value)}
            onKeyDown={e=>e.key==='Enter' && handleReset()} />
        </div>
        {error && <div className="auth-error">{error}</div>}
        {success && <div className="auth-success">{success}</div>}
        <button className="btn btn-primary" onClick={handleReset} disabled={loading} style={{marginTop:'4px'}}>
          {loading ? '⟳ Saving…' : 'Set password'}
        </button>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════

// Detect recovery token before React initializes (avoids timing issues)
function getRecoveryTokenFromURL() {
  const hash = window.location.hash;
  if (hash) {
    const params = new URLSearchParams(hash.replace('#', ''));
    if (params.get('type') === 'recovery' && params.get('access_token')) {
      return params.get('access_token');
    }
  }
  return null;
}
const INITIAL_RECOVERY_TOKEN = getRecoveryTokenFromURL();

function App() {
  // Auth state
  const [authToken, setAuthToken] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [recoveryToken, setRecoveryToken] = useState(INITIAL_RECOVERY_TOKEN);

  // App state
  const [sessions, setSessions] = useState([]);
  const [noteStates, setNoteStates] = useState({});
  const [lists, setLists] = useState({ waffe:[], ort:[], munition:[] });
  const [customDisz, setCustomDisz] = useState(() => LS.get('claylog_customdisz', []));
  const [syncStatus, setSyncStatus] = useState('idle');

  // UI state
  const [tab, setTab] = useState('dashboard');
  const [modal, setModal] = useState(null);
  const [selectedSession, setSelectedSession] = useState(null);

  const refreshTimerRef = useRef(null);

  /* ── AUTH ── */
  useEffect(() => {
    // If recovery token was detected at startup, skip normal auth load
    if (INITIAL_RECOVERY_TOKEN) {
      window.history.replaceState(null, '', window.location.pathname);
      return;
    }
    const saved = LS.get('claylog_auth', null);
    if (saved?.token) {
      setAuthToken(saved.token);
      setCurrentUser(saved.user);
      scheduleRefresh(saved.refresh_token, saved.expires_at);
      loadData(saved.token);
    }
  }, []);

  function saveAuth(data) {
    const expiresAt = Date.now() + (data.expires_in || 3600) * 1000;
    setAuthToken(data.access_token);
    setCurrentUser(data.user);
    LS.set('claylog_auth', { token: data.access_token, refresh_token: data.refresh_token, user: data.user, expires_at: expiresAt });
    scheduleRefresh(data.refresh_token, expiresAt);
  }

  function scheduleRefresh(refreshTok, expiresAt) {
    if (!refreshTok) return;
    if (refreshTimerRef.current) clearTimeout(refreshTimerRef.current);
    const delay = Math.max(0, (expiresAt||Date.now()) - Date.now() - 120000);
    refreshTimerRef.current = setTimeout(async () => {
      try {
        const data = await authRefresh(refreshTok);
        saveAuth(data);
      } catch { handleSignOut(); }
    }, delay);
  }

  function handleLogin(data) {
    saveAuth(data);
    loadData(data.access_token);
  }

  function handleSignOut() {
    setAuthToken(null); setCurrentUser(null);
    setSessions([]); setNoteStates({});
    LS.del('claylog_auth'); LS.del('claylog_sessions'); LS.del('claylog_notestates');
  }

  /* ── DATA ── */
  async function loadData(token) {
    setSyncStatus('syncing');
    try {
      const [sessionData, listData] = await Promise.all([
        sbFetch('GET', 'sessions', null, '?order=date.desc', token),
        sbFetch('GET', 'lists', null, '', token).catch(()=>[])
      ]);
      const s = Array.isArray(sessionData) ? sessionData : [];
      setSessions(s);
      LS.set('claylog_sessions', s);

      // Note states
      const ns = {};
      s.forEach(ses => { if (ses.note_state && ses.note_state !== 'normal') ns[ses.id] = ses.note_state; });
      setNoteStates(ns);
      LS.set('claylog_notestates', ns);

      // Lists
      if (listData?.length) {
        const ld = listData[0]?.data || { waffe:[], ort:[], munition:[] };
        setLists(ld);
        LS.set('claylog_lists', ld);
      } else {
        const saved = LS.get('claylog_lists', { waffe:[], ort:[], munition:[] });
        setLists(saved);
      }

      setSyncStatus('ok');
    } catch(e) {
      // Fall back to localStorage
      setSessions(LS.get('claylog_sessions', []));
      setNoteStates(LS.get('claylog_notestates', {}));
      setLists(LS.get('claylog_lists', { waffe:[], ort:[], munition:[] }));
      setSyncStatus('error');
    }
  }

  async function saveSession(session) {
    const newSessions = sessions.some(s=>s.id===session.id)
      ? sessions.map(s=>s.id===session.id?session:s)
      : [session, ...sessions];
    setSessions(newSessions);
    LS.set('claylog_sessions', newSessions);
    setModal(null); setSelectedSession(null);
    // Supabase upsert
    try {
      await sbFetch('POST', 'sessions', [session], '', authToken);
    } catch {}
  }

  async function deleteSession(id) {
    const newSessions = sessions.filter(s=>s.id!==id);
    setSessions(newSessions);
    LS.set('claylog_sessions', newSessions);
    setModal(null); setSelectedSession(null);
    try {
      await sbFetch('DELETE', 'sessions', null, `?id=eq.${id}`, authToken);
    } catch {}
  }

  async function toggleNote(sessionId, newState) {
    const ns = {...noteStates, [sessionId]: newState};
    if (newState === 'normal') delete ns[sessionId];
    setNoteStates(ns);
    LS.set('claylog_notestates', ns);
    // Update in Supabase
    try {
      await sbFetch('PATCH', 'sessions', { note_state: newState }, `?id=eq.${sessionId}`, authToken);
    } catch {}
  }

  async function saveLists(newLists) {
    setLists(newLists);
    LS.set('claylog_lists', newLists);
    try {
      await sbFetch('POST', 'lists', [{ user_id: currentUser?.id, data: newLists }], '', authToken);
    } catch {}
  }

  function saveCustomDisz(arr) {
    setCustomDisz(arr);
    LS.set('claylog_customdisz', arr);
  }

  function exportData() {
    const blob = new Blob([JSON.stringify({ sessions, lists, exportDate: new Date().toISOString() }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `claylog-backup-${todayStr()}.json`;
    a.click();
  }

  async function clearAllData() {
    if (!confirm('Delete ALL data? This cannot be undone!')) return;
    setSessions([]); setNoteStates({}); setLists({ waffe:[], ort:[], munition:[] });
    LS.del('claylog_sessions'); LS.del('claylog_notestates'); LS.del('claylog_lists');
    try {
      await sbFetch('DELETE', 'sessions', null, '', authToken);
    } catch {}
  }

  /* ── MODALS ── */
  function openNew() {
    setSelectedSession(null);
    setModal('new');
  }
  function openDetail(s) {
    setSelectedSession(s);
    setModal('detail');
  }
  function openEdit(s) {
    setSelectedSession(s);
    setModal('edit');
  }
  function closeModal() {
    setModal(null);
    setSelectedSession(null);
  }

  /* ── RENDER ── */
  if (recoveryToken) {
    return <ResetPasswordScreen accessToken={recoveryToken} onDone={() => setRecoveryToken(null)} />;
  }
  if (!authToken) {
    return <AuthScreen onLogin={handleLogin} />;
  }

  return (
    <div className="app">
      <Header user={currentUser} syncStatus={syncStatus} />

      <div className="main">
        {tab === 'dashboard' && <Dashboard sessions={sessions} onSessionClick={openDetail} />}
        {tab === 'sessions' && <SessionsPage sessions={sessions} onSessionClick={openDetail} />}
        {tab === 'notizen' && <NotizenPage sessions={sessions} noteStates={noteStates} onToggleNote={toggleNote} />}
        {tab === 'analyse' && <AnalysePage sessions={sessions} />}
        {tab === 'settings' && (
          <SettingsPage user={currentUser} lists={lists} syncStatus={syncStatus}
            customDisz={customDisz}
            onSaveCustomDisz={saveCustomDisz}
            onSignOut={handleSignOut}
            onSync={() => loadData(authToken)}
            onExport={exportData}
            onClearData={clearAllData}
            onSaveLists={saveLists} />
        )}
      </div>

      <button className="fab" onClick={openNew}>+</button>
      <BottomNav active={tab} onChange={setTab} />

      {(modal === 'new' || modal === 'edit') && (
        <SessionModal
          session={modal === 'edit' ? selectedSession : null}
          lists={lists}
          customDisz={customDisz}
          onSave={saveSession}
          onDelete={deleteSession}
          onClose={closeModal} />
      )}
      {modal === 'detail' && selectedSession && (
        <DetailModal
          session={selectedSession}
          onEdit={(s) => { setSelectedSession(s); setModal('edit'); }}
          onDelete={deleteSession}
          onClose={closeModal} />
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
