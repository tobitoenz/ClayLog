  const [passen, setPassen] = useState(() => {
    const p = session?.passen;
    if (Array.isArray(p) && p.length > 0) return p.length;
    const cfg = DISZ_CONFIG[session?.disziplin] || customDisz.find(d=>d.name===session?.disziplin) || DISZ_CONFIG['Fitasc'];
    return cfg?.passen || 4;
  });
  const [passenVals, setPassenVals] = useState(() => {
    const p = session?.passen;
    // Handle array from Supabase (numbers or strings)
    if (Array.isArray(p) && p.length > 0) {
      return p.map(v => (v === null || v === undefined || v === '') ? '' : String(v));
    }
    const cfg = DISZ_CONFIG[session?.disziplin] || DISZ_CONFIG['Fitasc'];
    return Array(cfg.passen).fill('');
  });
  const [maxPro, setMaxPro] = useState(() => {
    if (session?.id && session?.max) {
      const cfg = DISZ_CONFIG[session.disziplin];
      if (cfg) return cfg.maxPro;
      const cd = customDisz.find(d=>d.name===session.disziplin);
      return cd ? cd.maxPro : 25;
    }
    return DISZ_CONFIG[disziplin]?.maxPro || 25;
  });

  // scoreOnly state for custom disciplines with no passen
  const [scoreOnlyVal, setScoreOnlyVal] = useState(() => session?.score || '');
  const [scoreOnlyMax, setScoreOnlyMax] = useState(() => {
    if (session?.max) return session.max;
    const cd = customDisz.find(d=>d.name===session?.disziplin);
    return cd?.scoreOnly ? (cd.totalMax || '') : '';
  });

  // Check if current disziplin is scoreOnly
  const getCfg = (d) => DISZ_CONFIG[d] || customDisz.find(x=>x.name===d);
  const isScoreOnly = getCfg(disziplin)?.scoreOnly === true;

  // Track if this is the first render (to avoid overwriting loaded values on edit)
  const isFirstRender = useRef(true);
  useEffect(() => {
    if (isFirstRender.current) { isFirstRender.current = false; return; }
    // Only reset passen values when user actively changes disziplin/type (not on initial load)
    const cfg = getCfg(disziplin);
    if (!cfg) return;
    if (cfg.scoreOnly) {
      setScoreOnlyMax(cfg.totalMax || '');
      setScoreOnlyVal('');
    } else if (type === 'wettkampf' || hasScore) {
      const p = cfg.passen || 4;
      const mp = cfg.maxPro || 25;
      setPassen(p);
      setPassenVals(Array(p).fill(''));
      setMaxPro(mp);
    }
  }, [disziplin, type]);

  const totalScore = passenVals.reduce((a,v) => a + (parseInt(v)||0), 0);
  const totalMax = passen * maxPro;

  function handlePassen(delta) {
    setPassen(p => {
      const np = Math.max(1, Math.min(20, p + delta));
      setPassenVals(v => {
        const nv = [...v];
        while (nv.length < np) nv.push('');
        return nv.slice(0, np);
      });
      return np;
    });
  }

  function handleSave() {
    let score, max, passenArr;
    if (isScoreOnly) {
      score = parseInt(scoreOnlyVal)||0;
      max   = parseInt(scoreOnlyMax)||0;
      passenArr = [];
    } else {
      score = (type==='wettkampf' || hasScore) ? totalScore : null;
      max   = (type==='wettkampf' || hasScore) ? totalMax   : null;
      passenArr = (type==='wettkampf' || hasScore) ? passenVals.map(v => v === '' || v === null ? null : parseInt(v)) : [];
    }
    const s = {
      id: session?.id || crypto.randomUUID(),
      type, name, disziplin, date, notes,
      munition: parseInt(munition)||0,
      ort, waffe, munition_typ: munitionTyp,
      score, max, passen: passenArr,
    };
    onSave(s);
  }

  return (
    <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-handle" />
        <div className="modal-title">{isEdit ? 'Edit' : 'New Entry'}</div>

        {/* Type */}
        <div className="form-group">
          <label>Type</label>
          <div className="type-btn-row">
            <button className="type-btn" style={{background: type==='training'?'var(--accent)':'var(--card)', color: type==='training'?'#000':'var(--muted)', border:'1px solid var(--border)'}} onClick={()=>setType('training')}>🏋️ Practice</button>
            <button className="type-btn" style={{background: type==='wettkampf'?'var(--accent2)':'var(--card)', color: type==='wettkampf'?'#000':'var(--muted)', border:'1px solid var(--border)'}} onClick={()=>setType('wettkampf')}>🏆 Competition</button>
          </div>
        </div>

        {/* Name (optional) */}
        <div className="form-group">
          <label>Name <span style={{color:'var(--muted)',fontSize:11,fontWeight:400}}>(optional)</span></label>
          <input type="text" value={name} onChange={e=>setName(e.target.value)}
            placeholder={type==='wettkampf' ? 'z.B. Blaser Cup Bern' : 'z.B. Morgentraining'}/>
        </div>

        {/* Discipline + Date */}
        <div className="input-row">
          <div className="form-group">
            <label>Discipline</label>
            <select value={disziplin} onChange={e=>setDisziplin(e.target.value)}>
              {allDisz.map(d => <option key={d}>{d}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label>Date</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} />
          </div>
        </div>

        <div className="divider"><div className="divider-line"/><div className="divider-text">RESULT</div><div className="divider-line"/></div>

        {/* Score section */}
        {isScoreOnly ? (
          <ScoreOnlyInput
            scoreVal={scoreOnlyVal} maxVal={scoreOnlyMax}
            onChangeScore={setScoreOnlyVal} onChangeMax={setScoreOnlyMax} />
        ) : type === 'wettkampf' ? (
          <WettkampfScore passen={passen} passenVals={passenVals} maxPro={maxPro}
            totalScore={totalScore} totalMax={totalMax}
            onChangePassen={handlePassen}
            onChangeVal={(i,v) => { const nv=[...passenVals]; nv[i]=v; setPassenVals(nv); }} />
        ) : (
          <TrainingScore hasScore={hasScore} onToggle={()=>setHasScore(h=>!h)}
            passen={passen} passenVals={passenVals} maxPro={maxPro}
            totalScore={totalScore} totalMax={totalMax}
            onChangePassen={handlePassen}
            onChangeVal={(i,v) => { const nv=[...passenVals]; nv[i]=v; setPassenVals(nv); }} />
        )}

        {/* Notes */}
        <div className="form-group" style={{marginTop:8}}>
          <label>Notes</label>
          <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="How did it go? What worked, what didn't?" />
        </div>

        {/* Shells + Location */}
        <div className="input-row">
          <div className="form-group">
            <label>Shells</label>
            <input type="number" value={munition} onChange={e=>setMunition(e.target.value)} placeholder="25" min="0" />
          </div>
          <div className="form-group">
            <label>Location</label>
            <div className="select-row">
              <select value={ort} onChange={e=>setOrt(e.target.value)}>
                <option value="">– Location –</option>
                {(lists.ort||[]).map(o=><option key={o}>{o}</option>)}
              </select>
              <button className="add-btn" onClick={()=>addToList('ort','location',setOrt)} title="Add location">+</button>
            </div>
          </div>
        </div>

        {/* Ammo + Gun */}
        <div className="input-row">
          <div className="form-group">
            <label>Ammo</label>
            <div className="select-row">
              <select value={munitionTyp} onChange={e=>setMunitionTyp(e.target.value)}>
                <option value="">– Ammo –</option>
                {(lists.munition||[]).map(m=><option key={m}>{m}</option>)}
              </select>
              <button className="add-btn" onClick={()=>addToList('munition','ammo',setMunitionTyp)} title="Add ammo">+</button>
            </div>
          </div>
          <div className="form-group">
            <label>Gun</label>
            <div className="select-row">
              <select value={waffe} onChange={e=>setWaffe(e.target.value)}>
                <option value="">– Gun –</option>
                {(lists.waffe||[]).map(w=><option key={w}>{w}</option>)}
              </select>
              <button className="add-btn" onClick={()=>addToList('waffe','gun',setWaffe)} title="Add gun">+</button>
            </div>
          </div>
        </div>

        <button className="btn btn-primary" onClick={handleSave}>Save</button>
        {isEdit && <button className="btn btn-danger" style={{marginTop:8}} onClick={()=>onDelete(session.id)}>🗑 Delete</button>}
        <button className="btn btn-ghost" style={{marginTop:8}} onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

function makeGCalUrl({ title, date, dateEnd, location, notes }) {
  const d = date ? date.replace(/-/g,'') : '';
  // For end date, Google Calendar needs day+1 for all-day events
  let endD = '';
  if (dateEnd && dateEnd !== date) {
    const end = new Date(dateEnd+'T00:00:00');
    end.setDate(end.getDate()+1);
    endD = end.toISOString().slice(0,10).replace(/-/g,'');
  } else {
    const end = new Date((date||'')+'T00:00:00');
    end.setDate(end.getDate()+1);
    endD = end.toISOString().slice(0,10).replace(/-/g,'');
  }
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title || '',
    dates: `${d}/${endD}`,
    ...(location ? { location } : {}),
    ...(notes ? { details: notes } : {}),
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function ResetPasswordScreen({ accessToken, onDone }) {
  const [password, setPassword] = React.useState('');
  const [password2, setPassword2] = React.useState('');
  const [error, setError] = React.useState('');
  const [success, setSuccess] = React.useState('');
  const [loading, setLoading] = React.useState(false);

  async function handleReset() {
    if (!password || password.length < 6) { setError('Password must be at least 6 characters.'); return; }
    if (password !== password2) { setError('Passwords do not match.'); return; }
    setLoading(true); setError(''); setSuccess('');
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${accessToken}` },
        body: JSON.stringify({ password })
      });
      if (!res.ok) { const d = await res.json(); throw new Error(d.message || d.error_description || 'Error'); }
      setSuccess('✅ Password updated! You can now sign in.');
      window.history.replaceState(null, '', window.location.pathname);
      setTimeout(() => onDone(), 2500);
    } catch(e) {
      setError(e.message);
    } finally { setLoading(false); }
  }

  return (
    <div className="auth-screen">
      <div style={{marginBottom:'8px',textAlign:'center'}}>
        <div className="auth-logo">ClayLog</div>
      </div>
      <div className="auth-box">
        <div className="auth-title">Set new password</div>
        <div className="form-group">
          <label>New password</label>
          <input type="password" placeholder="Min. 6 characters" value={password}
            onChange={e=>setPassword(e.target.value)} />
        </div>
        <div className="form-group">
          <label>Repeat password</label>
          <input type="password" placeholder="Repeat password" value={password2}
            onChange={e=>setPassword2(e.target.value)}
            onKeyDown={e=>e.key==='Enter' && handleReset()} />
        </div>
        {error && <div className="auth-error">{error}</div>}
        {success && <div className="auth-success">{success}</div>}
        <button className="btn btn-primary" onClick={handleReset} disabled={loading} style={{marginTop:'4px'}}>
          {loading ? '⟳ Saving…' : 'Set password'}
        </button>
      </div>
    </div>
  );
}

// Detect recovery token before React initializes (avoids timing issues)
function getRecoveryTokenFromURL() {
  const hash = window.location.hash;
  if (hash) {
    const params = new URLSearchParams(hash.replace('#', ''));
    if (params.get('type') === 'recovery' && params.get('access_token')) {
      return params.get('access_token');
    }
  }
  return null;
}
const INITIAL_RECOVERY_TOKEN = getRecoveryTokenFromURL();

function App() {
  // Auth state
  const [authToken, setAuthToken] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [recoveryToken, setRecoveryToken] = useState(INITIAL_RECOVERY_TOKEN);

  // App state
  const [sessions, setSessions] = useState([]);
  const [events, setEvents] = useState(() => LS.get('claylog_events', []));
  const [noteStates, setNoteStates] = useState({});
  const [lists, setLists] = useState({ waffe:[], ort:[], munition:[] });
  const [customDisz, setCustomDisz] = useState(() => LS.get('claylog_customdisz', []));
  const [syncStatus, setSyncStatus] = useState('idle');

  // UI state
  const [tab, setTab] = useState('dashboard');
  const [modal, setModal] = useState(null);
  const [selectedSession, setSelectedSession] = useState(null);

  const refreshTimerRef = useRef(null);

  /* ── AUTH ── */
  useEffect(() => {
    // If recovery token was detected at startup, skip normal auth load
    if (INITIAL_RECOVERY_TOKEN) {
      window.history.replaceState(null, '', window.location.pathname);
      return;
    }
    const saved = LS.get('claylog_auth', null);
    if (saved?.token) {
      setAuthToken(saved.token);
      setCurrentUser(saved.user);
      scheduleRefresh(saved.refresh_token, saved.expires_at);
      loadData(saved.token);
    }
  }, []);

  function saveAuth(data) {
    const expiresAt = Date.now() + (data.expires_in || 3600) * 1000;
    setAuthToken(data.access_token);
    setCurrentUser(data.user);
    LS.set('claylog_auth', { token: data.access_token, refresh_token: data.refresh_token, user: data.user, expires_at: expiresAt });
    scheduleRefresh(data.refresh_token, expiresAt);
  }

  function scheduleRefresh(refreshTok, expiresAt) {
    if (!refreshTok) return;
    if (refreshTimerRef.current) clearTimeout(refreshTimerRef.current);
    // Refresh 3 minutes before expiry
    const delay = Math.max(0, (expiresAt||Date.now()) - Date.now() - 180000);
    refreshTimerRef.current = setTimeout(async () => {
      try {
        const data = await authRefresh(refreshTok);
        saveAuth(data);
        setSyncStatus('ok');
      } catch {
        // Retry once after 30 seconds before giving up
        setTimeout(async () => {
          try {
            const data = await authRefresh(refreshTok);
            saveAuth(data);
            setSyncStatus('ok');
          } catch { handleSignOut(); }
        }, 30000);
      }
    }, delay);
  }

  function handleLogin(data) {
    saveAuth(data);
    loadData(data.access_token);
  }

  function handleSignOut() {
    setAuthToken(null); setCurrentUser(null);
    setSessions([]); setNoteStates({}); setLists({ waffe:[], ort:[], munition:[] }); setCustomDisz([]);
    LS.del('claylog_auth'); LS.del('claylog_sessions'); LS.del('claylog_notestates');
    LS.del('claylog_lists'); LS.del('claylog_customdisz');
  }

  /* ── DATA ── */
  async function loadData(token) {
    setSyncStatus('syncing');
    try {
      const [sessionData, listData] = await Promise.all([
        sbFetch('GET', 'sessions', null, '?order=date.desc', token),
        sbFetch('GET', 'lists', null, '', token).catch(()=>[])
      ]);
      const raw = Array.isArray(sessionData) ? sessionData : [];
      const s = raw.map(r => ({
        id: r.id,
        type: r.type || 'training',
        disziplin: r.disziplin || 'Fitasc',
        date: r.date || '',
        score: r.score ?? null,
        max: r.max ?? null,
        passen: Array.isArray(r.passen) ? r.passen : [],
        notes: r.notes || '',
        waffe: r.waffe || '',
        ort: r.ort || '',
        munition: r.munition || 0,
        munition_typ: r.munition_typ || '',
        note_state: r.note_state || 'normal',
      }));
      setSessions(s);
      LS.set('claylog_sessions', s);

      // Note states
      const ns = {};
      s.forEach(ses => { if (ses.note_state && ses.note_state !== 'normal') ns[ses.id] = ses.note_state; });
      setNoteStates(ns);
      LS.set('claylog_notestates', ns);

      // Lists + custom disciplines
      if (listData?.length) {
        const ld = listData[0]?.data || { waffe:[], ort:[], munition:[] };
        const { customDisz: cdFromSb, ...listsOnly } = ld;
        setLists(listsOnly);
        LS.set('claylog_lists', listsOnly);
        if (cdFromSb?.length) {
          setCustomDisz(cdFromSb);
          LS.set('claylog_customdisz', cdFromSb);
        }
      } else {
        const saved = LS.get('claylog_lists', { waffe:[], ort:[], munition:[] });
        setLists(saved);
      }

      setSyncStatus('ok');
    } catch(e) {
      // Fall back to localStorage
      setSessions(LS.get('claylog_sessions', []));
      setNoteStates(LS.get('claylog_notestates', {}));
      setLists(LS.get('claylog_lists', { waffe:[], ort:[], munition:[] }));
      setSyncStatus('error');
    }
  }

  function saveEvent(ev) {
    const newEvents = events.some(e=>e.id===ev.id)
      ? events.map(e=>e.id===ev.id?ev:e)
      : [ev, ...events];
    setEvents(newEvents);
    LS.set('claylog_events', newEvents);
    setModal(null); setSelectedSession(null);
  }

  function deleteEvent(id) {
    const newEvents = events.filter(e=>e.id!==id);
    setEvents(newEvents);
    LS.set('claylog_events', newEvents);
    setModal(null); setSelectedSession(null);
  }

  async function saveSession(session) {
    const newSessions = sessions.some(s=>s.id===session.id)
      ? sessions.map(s=>s.id===session.id?session:s)
      : [session, ...sessions];
    setSessions(newSessions);
    LS.set('claylog_sessions', newSessions);
    setModal(null); setSelectedSession(null);
    // Supabase upsert
    try {
      setSyncStatus('syncing');
      const row = { ...session, user_id: currentUser?.id };
      await sbFetch('POST', 'sessions', [row], '', authToken);
      setSyncStatus('ok');
    } catch(e) {
      console.error('saveSession error:', e);
      setSyncStatus('error');
    }
  }

  async function deleteSession(id) {
    const newSessions = sessions.filter(s=>s.id!==id);
    setSessions(newSessions);
    LS.set('claylog_sessions', newSessions);
    setModal(null); setSelectedSession(null);
    try {
      setSyncStatus('syncing');
      await sbFetch('DELETE', 'sessions', null, `?id=eq.${id}&user_id=eq.${currentUser?.id}`, authToken);
      setSyncStatus('ok');
    } catch { setSyncStatus('error'); }
  }

  async function toggleNote(sessionId, newState) {
    const ns = {...noteStates, [sessionId]: newState};
    if (newState === 'normal') delete ns[sessionId];
    setNoteStates(ns);
    LS.set('claylog_notestates', ns);
    // Update in Supabase
    try {
      await sbFetch('PATCH', 'sessions', { note_state: newState }, `?id=eq.${sessionId}`, authToken);
    } catch {}
  }

  async function saveLists(newLists) {
    setLists(newLists);
    LS.set('claylog_lists', newLists);
    try {
      const cd = LS.get('claylog_customdisz', []);
      await sbFetch('POST', 'lists', [{ user_id: currentUser?.id, data: { ...newLists, customDisz: cd } }], '', authToken);
    } catch {}
  }

  async function saveCustomDisz(arr) {
    setCustomDisz(arr);
    LS.set('claylog_customdisz', arr);
    // Sync to Supabase alongside lists
    try {
      const currentLists = LS.get('claylog_lists', { waffe:[], ort:[], munition:[] });
      await sbFetch('POST', 'lists', [{ user_id: currentUser?.id, data: { ...currentLists, customDisz: arr } }], '', authToken);
    } catch {}
  }

  function exportData() {
    const blob = new Blob([JSON.stringify({ sessions, lists, exportDate: new Date().toISOString() }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `claylog-backup-${todayStr()}.json`;
    a.click();
  }

  async function clearAllData() {
    if (!confirm('Delete ALL data? This cannot be undone!')) return;
    setSessions([]); setNoteStates({}); setLists({ waffe:[], ort:[], munition:[] }); setCustomDisz([]);
    LS.del('claylog_sessions'); LS.del('claylog_notestates'); LS.del('claylog_lists'); LS.del('claylog_customdisz');
    try {
      await sbFetch('DELETE', 'sessions', null, `?user_id=eq.${currentUser?.id}`, authToken);
    } catch {}
  }

  const [icsUrl, setIcsUrl] = useState(() => { try { return localStorage.getItem('claylog_icsurl') || ''; } catch { return ''; } });

  function saveIcsUrl(url) {
    setIcsUrl(url);
    try { localStorage.setItem('claylog_icsurl', url); } catch {}
  }

  function openNewWithPrefill(prefill = {}) {
    setSelectedSession({ _prefill: prefill });
    setModal('new');
  }
  function openNew() {
    setSelectedSession(null);
    setModal('new');
  }
  function openDetail(s) {
    setSelectedSession(s);
    setModal('detail');
  }
  function openEdit(s) {
    setSelectedSession(s);
    setModal('edit');
  }
  function closeModal() {
    setModal(null);
    setSelectedSession(null);
  }

  /* ── RENDER ── */
  if (recoveryToken) {
    return <ResetPasswordScreen accessToken={recoveryToken} onDone={() => setRecoveryToken(null)} />;
  }
  if (!authToken) {
    return <AuthScreen onLogin={handleLogin} />;
  }

  return (
    <div className="app">
      <Header user={currentUser} syncStatus={syncStatus} />

      <div className="main">
        {tab === 'dashboard' && <Dashboard sessions={sessions} onSessionClick={openDetail} icsUrl={icsUrl} onCreateSession={openNewWithPrefill} manualEvents={events} />}
        {tab === 'sessions' && <SessionsPage sessions={sessions} onSessionClick={openDetail} />}
        {tab === 'events' && <EventsPage icsUrl={icsUrl} manualEvents={events} onSaveEvent={saveEvent} onDeleteEvent={deleteEvent} onCreateSession={openNewWithPrefill} />}
        {tab === 'notizen' && <NotizenPage sessions={sessions} noteStates={noteStates} onToggleNote={toggleNote} />}
        {tab === 'analyse' && <AnalysePage sessions={sessions} />}
        {tab === 'settings' && (
          <SettingsPage user={currentUser} lists={lists} syncStatus={syncStatus}
            customDisz={customDisz}
            onSaveCustomDisz={saveCustomDisz}
            onSignOut={handleSignOut}
            onSync={() => loadData(authToken)}
            onExport={exportData}
            onClearData={clearAllData}
            onSaveLists={saveLists}
            icsUrl={icsUrl}
            onSaveIcsUrl={saveIcsUrl} />
        )}
      </div>

      {!modal && <button className="fab" onClick={openNew}>+</button>}
      <BottomNav active={tab} onChange={setTab} />

      {(modal === 'new' || modal === 'edit') && (
        <SessionModal
          key={modal === 'edit' ? selectedSession?.id : 'new'}
          session={modal === 'edit' ? selectedSession : null}
          prefill={modal === 'new' ? selectedSession?._prefill : null}
          lists={lists}
          customDisz={customDisz}
          onSave={saveSession}
          onDelete={deleteSession}
          onClose={closeModal}
          onSaveLists={saveLists}
          lastSession={modal === 'new' ? (sessions[0] || null) : null} />
      )}
      {modal === 'detail' && selectedSession && (
        <DetailModal
          session={selectedSession}
          onEdit={(s) => { setSelectedSession(s); setModal('edit'); }}
          onDelete={deleteSession}
          onClose={closeModal} />
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
